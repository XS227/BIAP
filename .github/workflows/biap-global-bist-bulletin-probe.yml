name: BIAP Global BIST official bulletin probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-bist-bulletin-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests
      - run: python tools/probe_bist_daily_bulletin.py
