name: Mobile check

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx expo prebuild --platform android --non-interactive
      - run: chmod +x android/gradlew
      # The debug build type does not bundle JS (RN's default debuggableVariants
      # expects a live Metro dev server), so an installed debug APK gets stuck on
      # the splash screen with no dev server reachable. Build release instead —
      # Expo's generated build.gradle signs it with the debug keystore by default,
      # so this still installs directly without a separate signing setup.
      - run: ./gradlew assembleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: biap-latest-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
