name: BIAP Global Nasdaq Nordic public report probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-nasdaq-nordic-report-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install -q requests openpyxl
      - name: Inspect official public Nasdaq Nordic workbook
        run: |
          python3 - <<'PY'
          import io, json, requests, openpyxl
          url='https://attachment.news.eu.nasdaq.com/a448893223fb4755b7f9d92d18b128b24'
          r=requests.get(url,timeout=60,headers={'User-Agent':'BIAP Global source probe'})
          r.raise_for_status()
          print('status',r.status_code,'bytes',len(r.content),'content-type',r.headers.get('content-type'))
          wb=openpyxl.load_workbook(io.BytesIO(r.content),read_only=True,data_only=True)
          out={}
          for ws in wb.worksheets:
              sample=[]
              for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,18),values_only=True):
                  vals=[v for v in row if v not in (None,'')]
                  if vals:
                      sample.append([str(v)[:120] for v in vals[:12]])
              out[ws.title]={'rows':ws.max_row,'cols':ws.max_column,'sample':sample[:12]}
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
