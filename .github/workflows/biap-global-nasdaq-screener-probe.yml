name: BIAP Global Nasdaq full screener probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-nasdaq-screener-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests
      - run: python tools/probe_nasdaq_full_screener.py
