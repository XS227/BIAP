name: BIAP Global SIX Nestle production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-six-nestle-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify Nestle official annual filing on production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          ticker='NESN'
          r=s.get(base+'/instruments/CH/SIX',params={'q':ticker,'limit':5},timeout=90)
          print('SEARCH',r.status_code,r.text[:10000])
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
          assert exact, rows
          row=exact[0]
          payload={'country':'CH','exchange':'SIX','ticker':ticker,'name':row.get('name'),
                   'currency':row.get('currency') or 'CHF','isin':row.get('isin'),'lei':row.get('lei')}
          a=s.post(base+'/analyze',json=payload,timeout=210)
          print('ANALYZE',a.status_code,a.text[:32000])
          a.raise_for_status()
          data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
          assert any(x.get('provider')=='official-nestle-annual-financial-statements-v1' for x in sources), sources
          assert any(x.get('source_type')=='official_issuer_financial_statement' for x in sources), sources
          assert company.get('filing_period_end') == '2025-12-31', company
          assert company.get('revenue') and company.get('revenue') > 80_000_000_000, company
          assert company.get('net_income') and company.get('net_income') > 8_000_000_000, company
          assert company.get('total_assets') and company.get('total_assets') > 120_000_000_000, company
          assert company.get('total_liabilities') and company.get('total_liabilities') > 90_000_000_000, company
          assert company.get('total_equity') and company.get('total_equity') > 30_000_000_000, company
          assert company.get('operating_cash_flow') and company.get('operating_cash_flow') > 15_000_000_000, company
          evidence=data.get('evidence') or {}
          missing=evidence.get('missing_critical') or []
          assert 'fundamental_source' not in missing, evidence
          assert evidence.get('status') == 'PASS', evidence
          print('OK NESN official annual filing connected',
                company.get('revenue'),company.get('net_income'),company.get('total_assets'),
                company.get('total_liabilities'),company.get('total_equity'),
                company.get('operating_cash_flow'),company.get('filing_period_end'),
                evidence.get('status'),missing)
          PY
