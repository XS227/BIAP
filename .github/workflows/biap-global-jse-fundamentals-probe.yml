name: BIAP Global JSE fundamentals probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-jse-fundamentals-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - name: Trace public JSE SENS and annual-report endpoints
        shell: bash
        run: |
          python - <<'PY'
          import re,requests,urllib.parse
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'en-US,en;q=0.9'}

          def get(name,url):
              try:
                  r=requests.get(url,headers=H,timeout=45)
                  print('\n###',name,'STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'URL',r.url)
                  print(r.text[:1200].replace('\n',' ') if 'text' in (r.headers.get('content-type') or '') else repr(r.content[:400]))
                  return r
              except Exception as e:
                  print(name,'ERROR',type(e).__name__,e)

          pages=[
            ('SENS','https://clientportal.jse.co.za/communication/sens-announcements'),
            ('SENS_JSE','https://clientportal.jse.co.za/communication/sens-announcements?issuermasterid=2310'),
            ('JSE_REPORTS','https://group.jse.co.za/investor-relations/reporting-suite'),
          ]
          for name,url in pages:
              r=get(name,url)
              if not r or not r.ok: continue
              html=r.text
              soup=BeautifulSoup(html,'html.parser')
              for s in soup.find_all('script',src=True):
                  src=urllib.parse.urljoin(r.url,s['src'])
                  print('SCRIPT',name,src)
                  try:
                      js=requests.get(src,headers=H,timeout=30).text
                  except Exception:
                      continue
                  for needle in ('sens','announcement','issuer','api','ajax','reporting'):
                      if needle in js.lower():
                          for m in list(re.finditer(needle,js,re.I))[:10]:
                              ctx=js[max(0,m.start()-700):m.start()+1400]
                              if any(k in ctx.lower() for k in ('http','ajax','api','sens','issuer')):
                                  print('JS_CTX',name,needle,ctx[:3000])
              for a in soup.find_all('a',href=True):
                  href=urllib.parse.urljoin(r.url,a['href'])
                  txt=' '.join(a.stripped_strings)
                  low=(href+' '+txt).lower()
                  if any(k in low for k in ('annual','financial','sens','announcement','results','excel','xlsx','pdf')):
                      print('LINK',name,txt[:160],href)
          PY
