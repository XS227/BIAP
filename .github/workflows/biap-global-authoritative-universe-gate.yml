name: BIAP Global authoritative universe gate

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-authoritative-universe-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply ranking authority patch
        run: python tools/apply_ranking_authority_gate.py
      - name: Run Global backend tests
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q global_markets global_routes.py
          pytest -q tests/test_global_*.py
      - name: Commit ranking authority gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/scanner.py analysis/tests/test_global_ranking_authority.py
          git diff --cached --quiet && exit 0
          git commit -m 'Require authoritative exchange universe for rankings'
          git push origin HEAD:feat/biap-global
