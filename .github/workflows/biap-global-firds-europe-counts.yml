name: BIAP Global FIRDS Europe counts

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-firds-europe-counts.yml'
      - 'tools/probe_firds_europe_counts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests
      - run: python tools/probe_firds_europe_counts.py
