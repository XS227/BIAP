name: BIAP Global Europe identity probe

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-europe-identity-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        working-directory: analysis
        run: python -m pip install -r requirements.txt
      - name: Probe unresolved identities
        working-directory: analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import unicodedata
          import httpx
          from global_markets.gleif import GLEIFResolver, _legal_core_query

          cases = [
              ('FR', "LVMH Moët Hennessy Louis Vuitton SE"),
              ('FR', "L'Oréal S.A."),
              ('ES', 'Banco Santander, S.A.'),
          ]
          resolver = GLEIFResolver(timeout=15)
          for country, name in cases:
              ascii_name = ''.join(ch for ch in unicodedata.normalize('NFKD', name) if not unicodedata.combining(ch))
              variants = []
              for value in (name, ascii_name, _legal_core_query(name), _legal_core_query(name).replace(' ', '')):
                  value = value.strip()
                  if value and value not in variants:
                      variants.append(value)
              print('CASE', country, repr(name), 'VARIANTS', variants)
              seen = {}
              for query in variants:
                  try:
                      rows = resolver._search(query, page_size=100)
                  except Exception as exc:
                      print(' SEARCH_ERROR', repr(query), type(exc).__name__, str(exc))
                      continue
                  print(' SEARCH', repr(query), 'COUNT', len(rows))
                  for row in rows:
                      if row.lei in seen:
                          continue
                      seen[row.lei] = row
                      print('  CANDIDATE', json.dumps({
                          'lei': row.lei, 'name': row.legal_name,
                          'jurisdiction': row.legal_jurisdiction,
                          'entityStatus': row.entity_status,
                          'registrationStatus': row.registration_status,
                      }, ensure_ascii=False, sort_keys=True))
              for lei, row in seen.items():
                  try:
                      r = httpx.get('https://filings.xbrl.org/api/filings', params={
                          'filter[entity.identifier]': lei,
                          'page[size]': 3,
                          'sort': '-period_end',
                      }, timeout=20, headers={'Accept':'application/json','User-Agent':'BIAP-Global/1.0 identity-probe'})
                      r.raise_for_status()
                      payload = r.json()
                      data = payload.get('data') if isinstance(payload, dict) else []
                      periods = []
                      for item in data if isinstance(data, list) else []:
                          attrs = item.get('attributes') if isinstance(item, dict) and isinstance(item.get('attributes'), dict) else {}
                          periods.append((attrs.get('country'), attrs.get('period_end')))
                      print('  ESEF', lei, periods)
                  except Exception as exc:
                      print('  ESEF_ERROR', lei, type(exc).__name__, str(exc))
          PY
