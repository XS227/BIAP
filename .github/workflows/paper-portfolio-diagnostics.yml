name: paper-portfolio-diagnostics

# Branch-only research workflow. It never deploys, restarts services, or modifies
# the frozen research snapshot. Temporary branch push trigger validates the job;
# remove that trigger after the validation run so the final workflow is manual-only.
on:
  push:
    branches: [research/paper-portfolio-diagnostics-20261119]
    paths:
      - '.github/workflows/paper-portfolio-diagnostics.yml'
  workflow_dispatch:
    inputs:
      metadata_mode:
        description: 'Yahoo current market-cap/sector metadata (post-event proxy), or no metadata'
        type: choice
        options:
          - live
          - none
        default: live
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen snapshot hash
        shell: bash
        run: |
          set -euo pipefail
          (cd research && sha256sum -c paper_portfolio_2026-10-20.json.sha256)
      - name: Run offline diagnostics unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q research/paper_portfolio_diagnostics.py
          python3 -m unittest discover -s research/tests -p 'test_paper_portfolio_diagnostics.py' -v
      - name: Install Yahoo Finance metadata reader
        if: github.event_name == 'push' || inputs.metadata_mode == 'live'
        run: python3 -m pip install --disable-pip-version-check 'yfinance>=0.2.55,<1'
      - name: Download preliminary-run reference summary (for drift audit)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/biap-reference"
          gh run download 44507537301 --repo "$GITHUB_REPOSITORY" \
            --name biap-preliminary-oct20-returns-2026-11-18 \
            --dir "${{ runner.temp }}/biap-reference"
      - name: Run read-only 2026-11-18 post-freeze diagnostics
        shell: bash
        env:
          OUT: ${{ runner.temp }}/biap-diagnostics
          # Branch validation now checks best-effort live sector and cap coverage; manual default is live.
          META: ${{ github.event_name == 'push' && 'live' || inputs.metadata_mode }}
        run: |
          set -euo pipefail
          python3 research/paper_portfolio_diagnostics.py \
            --snapshot research/paper_portfolio_2026-10-20.json \
            --end 2026-11-18 \
            --metadata-mode "$META" \
            --out-dir "$OUT" | tee "${{ runner.temp }}/diagnostics_log.txt"
          cp "${{ runner.temp }}/diagnostics_log.txt" "$OUT/job_summary.txt"
      - name: Audit return consistency against original preliminary run
        if: success()
        shell: bash
        env:
          OUT: ${{ runner.temp }}/biap-diagnostics
          REF: ${{ runner.temp }}/biap-reference/returns_full.json
        run: |
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path
          ref, out = Path(os.environ["REF"]), Path(os.environ["OUT"])
          if not ref.exists():
              (out/"price_reconciliation.txt").write_text("Original reference artifact unavailable; same Yahoo price source and 2026-11-18 exit used, but exact vintage cannot be confirmed.\n")
              print("Original reference artifact unavailable; price vintage not identical by guarantee.")
          else:
              old = json.loads(ref.read_text())["B_returns_priced_subset"]["markets"]
              new = {r["market"]: r for r in json.loads((out/"diagnostics.json").read_text())["summary"]}
              with (out/"price_reconciliation.csv").open("w",newline="") as f:
                  writer=csv.writer(f);writer.writerow(["market","basket","old_mean_pct","diagnostic_mean_pct","difference_percentage_points"])
                  for market, oldrow in sorted(old.items()):
                      for side in ["BUY","SELL"]:
                          a=oldrow[side]["equalWeightReturn"]
                          b=new[market][side.lower()+"_mean_pct"]
                          delta=None if a is None or b is None else round(b-a*100,5)
                          writer.writerow([market,side,None if a is None else round(a*100,5),b,delta])
                          if delta is not None and abs(delta)>0.25:
                              print(f"PRICE VINTAGE WARNING: {market} {side}: mean drift {delta:+.3f}pp")
              print("Preliminary-run comparison saved as price_reconciliation.csv")
          PY
      - name: Upload diagnostics files (never commit results to repository)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-portfolio-diagnostics-2026-11-18-${{ github.run_id }}
          path: ${{ runner.temp }}/biap-diagnostics/
          if-no-files-found: warn
          retention-days: 30
