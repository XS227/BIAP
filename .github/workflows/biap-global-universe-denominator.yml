name: BIAP Global universe denominator integrity

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-universe-denominator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply denominator integrity patch
        run: python tools/apply_universe_denominator_metadata.py
      - name: Install dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Compile and test
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Commit denominator integrity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/cached_universe.py analysis/global_markets/scanner.py
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve official universe denominator in rankings'
          git push origin HEAD:feat/biap-global
