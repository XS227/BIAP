name: BIAP mobile checkpoint validation

on:
  pull_request:
    branches: [live/base-20261030]
    paths:
      - 'mobile/**'
      - 'mobile-global/**'
      - 'tools/mobile_checkpoint_readonly_smoke.py'
      - 'tools/mobile_checkpoint_saved_company_smoke.py'
      - 'tools/mobile_checkpoint_iran_inbox_smoke.py'
      - 'tools/mobile_checkpoint_liara_financial_probe.py'
      - 'analysis/global_markets/saved_company_view.py'
      - 'analysis/global_markets/saved_company_ai.py'
      - 'analysis/iran_company_view.py'
      - 'analysis/iran_company_routes.py'
      - 'analysis/tests/test_global_saved_company_ai.py'
      - 'analysis/tests/test_iran_company_view.py'
      - 'tools/mobile_checkpoint_inprocess_api_smoke.py'
      - 'analysis/tests/test_global_saved_company_view.py'
      - 'analysis/global_routes.py'
      - '.github/workflows/biap-mobile-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, mobile-global]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Read-only API sampler offline self-test
        run: python ../tools/mobile_checkpoint_readonly_smoke.py --self-test
      - name: Saved Global three-company contract offline self-test
        run: python ../tools/mobile_checkpoint_saved_company_smoke.py --self-test
      - name: Verified Liara inbox Pekerman diagnostic offline self-test
        run: python ../tools/mobile_checkpoint_iran_inbox_smoke.py --self-test
      - name: Liara-only statement reconciliation offline self-test
        run: python ../tools/mobile_checkpoint_liara_financial_probe.py --self-test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Synthetic checkpoint safeguards
        run: npm run test:checkpoint
      - name: API contracts and broker/read-only data guards
        run: npm run test:api --if-present
      - name: Lint (non-interactive)
        env:
          CI: '1'
        run: npm run lint

  saved-global-readonly:
    # Isolated backend contract test; never connects to the live API or ledger.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Verify Global and Iran saved views, proxy guards and audit contracts
        env:
          PYTHONPATH: analysis
        run: python -m pytest -q analysis/tests/test_global_saved_company_view.py analysis/tests/test_global_saved_company_ai.py analysis/tests/test_iran_company_view.py
