name: BIAP Global Sweden gate

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-sweden-gate.yml'

permissions:
  contents: read

jobs:
  sweden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe Sweden production end to end
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          base = 'https://biap.dadashi.no/global-api/global'
          cases = ['VOLV.B','ERIC.B','ATCO.A','ATCO.B','INVE.B','SEB.A','SWED.A','HM.B','SAND','ASSA.B']
          metric_names = (
              'revenue','revenue_yoy_pct','net_income','total_assets','total_liabilities',
              'total_equity','operating_cash_flow','free_cash_flow','total_debt','eps',
          )

          def norm(v):
              return ''.join(ch for ch in str(v or '').upper() if ch.isalnum())

          def get_json(url, timeout=45):
              with urllib.request.urlopen(url, timeout=timeout) as response:
                  return json.load(response)

          def post_json(url, body, timeout=75):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode('utf-8'),
                  headers={'Content-Type':'application/json','Accept':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          report = {
              'market': 'SE/NASDAQ_STOCKHOLM',
              'catalog': None,
              'cases': [],
              'summary': {},
          }

          try:
              countries = get_json(f'{base}/countries', 30)
              sweden = next((row for row in countries.get('countries', []) if row.get('country') == 'SE'), None)
              report['catalog'] = sweden
          except Exception as exc:
              report['catalogError'] = f'{type(exc).__name__}: {exc}'

          for ticker in cases:
              row = {'tickerRequested': ticker}
              try:
                  q = urllib.parse.urlencode({'q': ticker, 'limit': 30})
                  catalog = get_json(f'{base}/instruments/SE/NASDAQ_STOCKHOLM?{q}', 45)
                  candidates = catalog.get('instruments') or []
                  exact = next((item for item in candidates if norm(item.get('ticker')) == norm(ticker)), None)
                  row['catalogReturned'] = len(candidates)
                  row['catalogMic'] = catalog.get('mic')
                  if exact is None:
                      row['catalogStatus'] = 'NOT_FOUND'
                      report['cases'].append(row)
                      continue
                  row.update({
                      'catalogStatus': 'FOUND',
                      'tickerResolved': exact.get('ticker'),
                      'name': exact.get('name'),
                      'isin': exact.get('isin'),
                      'lei': exact.get('lei'),
                      'currency': exact.get('currency'),
                  })
                  payload = post_json(f'{base}/analyze', {
                      'country': 'SE',
                      'exchange': 'NASDAQ_STOCKHOLM',
                      'ticker': exact.get('ticker') or ticker,
                      'name': exact.get('name') or ticker,
                      'currency': exact.get('currency') or 'SEK',
                      'isin': exact.get('isin'),
                      'lei': exact.get('lei'),
                  })
                  company = payload.get('company') or {}
                  diag = payload.get('providerDiagnostics') or {}
                  fundamentals = {key: company.get(key) for key in metric_names if company.get(key) is not None}
                  row.update({
                      'analysisStatus': 'OK',
                      'price': company.get('price'),
                      'marketStatus': diag.get('marketStatus'),
                      'marketProvider': diag.get('marketProvider'),
                      'marketError': diag.get('marketError'),
                      'fundamentalsStatus': diag.get('fundamentalsStatus'),
                      'fundamentalsProvider': diag.get('fundamentalsProvider'),
                      'fundamentalsError': diag.get('fundamentalsError'),
                      'fundamentalFields': sorted(fundamentals),
                      'evidenceStatus': (payload.get('evidence') or {}).get('status'),
                      'coverage': (payload.get('evidence') or {}).get('coverage'),
                      'call': payload.get('call'),
                      'sources': sorted({str(s.get('provider')) for s in (company.get('sources') or [])}),
                  })
              except Exception as exc:
                  row['analysisStatus'] = 'ERROR'
                  row['error'] = f'{type(exc).__name__}: {exc}'
              report['cases'].append(row)

          rows = report['cases']
          report['summary'] = {
              'requested': len(rows),
              'catalogFound': sum(r.get('catalogStatus') == 'FOUND' for r in rows),
              'analysisOk': sum(r.get('analysisStatus') == 'OK' for r in rows),
              'priceOk': sum(isinstance(r.get('price'), (int, float)) and r.get('price', 0) > 0 for r in rows),
              'fundamentalsOk': sum(bool(r.get('fundamentalFields')) for r in rows),
              'evidencePassOrWarn': sum(r.get('evidenceStatus') in {'PASS','WARN'} for r in rows),
          }
          Path('sweden-production-report.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report['summary'], sort_keys=True))
          for row in rows:
              print(json.dumps(row, sort_keys=True))
          PY

      - name: Upload Sweden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweden-production-report
          path: sweden-production-report.json
          if-no-files-found: error
