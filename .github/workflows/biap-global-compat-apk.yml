name: BIAP Global Compatibility APK

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-compat-apk.yml'
  workflow_dispatch:

concurrency:
  group: biap-global-compat-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_BIAP_GLOBAL_PREVIEW: '1'
      EXPO_PUBLIC_BIAP_GLOBAL_API_BASE: 'https://biap.dadashi.no/global-api'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Configure separately installable universal compatibility build
        shell: bash
        run: |
          test -f android/app/debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          marker = 'release {'
          if marker not in text:
              raise SystemExit('release build type not found')
          head, tail = text.split(marker, 1)
          block, rest = tail.split('}', 1)
          additions = []
          if 'signingConfig signingConfigs.debug' not in block:
              additions.append('            signingConfig signingConfigs.debug')
          if 'applicationIdSuffix ".compat"' not in block:
              additions.append('            applicationIdSuffix ".compat"')
          block = '\n'.join(additions) + ('\n' if additions else '') + block
          text = head + marker + block + '}' + rest
          # Use a deliberately high test version code so an older compat build cannot block install.
          text = text.replace('versionCode 3', 'versionCode 300')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build universal release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=4
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Name compatibility APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "BIAP-Global-0.3.0-compat-universal.apk"
          sha256sum "BIAP-Global-0.3.0-compat-universal.apk" > "BIAP-Global-0.3.0-compat-universal.apk.sha256"
      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-global-0.3.0-compat-universal-${{ github.sha }}
          path: |
            mobile/BIAP-Global-0.3.0-compat-universal.apk
            mobile/BIAP-Global-0.3.0-compat-universal.apk.sha256
          if-no-files-found: error
          retention-days: 14
