name: BIAP Global Top post-BIST audit

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-top-post-bist-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests
      - run: python tools/probe_global_top_readiness.py
