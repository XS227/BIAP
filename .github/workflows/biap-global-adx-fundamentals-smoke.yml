name: BIAP Global ADX fundamentals production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-adx-fundamentals-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify ALDAR official summary on production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          r=s.get(base+'/instruments/AE/ADX',params={'q':'ALDAR','limit':5},timeout=60)
          print('SEARCH',r.status_code,r.text[:5000])
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          if not rows:
              raise SystemExit('ALDAR not found in ADX universe')
          row=rows[0]
          payload={
              'country':'AE','exchange':'ADX','ticker':row.get('ticker') or 'ALDAR',
              'name':row.get('name'),'currency':row.get('currency') or 'AED',
              'isin':row.get('isin'),'lei':row.get('lei'),
          }
          a=s.post(base+'/analyze',json=payload,timeout=90)
          print('ANALYZE',a.status_code,a.text[:20000])
          a.raise_for_status()
          data=a.json()
          company=data.get('company') or {}
          sources=company.get('sources') or []
          assert any(x.get('provider')=='official-adx-financial-summary' for x in sources), sources
          assert company.get('net_income') is not None
          assert company.get('total_equity') is not None
          assert company.get('eps') is not None
          assert company.get('pb') is not None
          # Partial summary must not be mistaken for complete filing evidence.
          evidence=data.get('evidence') or {}
          assert evidence.get('status') == 'BLOCK', evidence
          assert 'fundamental_source' in (evidence.get('missing_critical') or []), evidence
          print('OK official ADX summary present and complete-filing gate remains blocked')
          PY
