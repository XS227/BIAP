name: BIAP Global official B3 integration

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-b3-official-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply B3 official adapter
        run: python tools/apply_b3_official_integration.py
      - name: Backend Global tests
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Commit tested B3 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/b3_official.py analysis/global_markets/runtime.py analysis/global_markets/scanner.py analysis/tests/test_global_b3_official.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use official B3 universe and daily equity market data'
          git push origin HEAD:feat/biap-global
