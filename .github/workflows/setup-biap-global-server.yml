name: Setup BIAP Global server

on:
  push:
    branches: [feat/biap-global]
    paths:
      - 'analysis/global_markets/**'
      - 'analysis/global_routes.py'
      - 'analysis/global_api_server.py'
      - 'analysis/.env.global.example'
      - 'deploy/setup-global-data.sh'
      - '.github/workflows/setup-biap-global-server.yml'
  workflow_dispatch:

concurrency:
  group: biap-global-server-setup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q global_markets global_routes.py global_api_server.py
      - run: pytest -q tests/test_global_agents.py tests/test_global_architecture.py

  setup-isolated-server:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '5.249.252.88' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Check isolated deploy credentials
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured" >&2; exit 1; }
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_global_key
          chmod 600 ~/.ssh/biap_global_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Prepare separate Global checkout and data cache
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/biap_global_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/home/ubuntu/biap-global/BIAP
          PARENT=$(dirname "$APP_DIR")
          mkdir -p "$PARENT"
          if [[ ! -d "$APP_DIR/.git" ]]; then
            git clone --branch feat/biap-global --single-branch https://github.com/XS227/BIAP.git "$APP_DIR"
          else
            cd "$APP_DIR"
            if [[ -n "$(git status --porcelain)" ]]; then
              echo "Refusing Global update: separate checkout has local changes" >&2
              git status --short
              exit 1
            fi
            git fetch origin feat/biap-global
            git checkout feat/biap-global
            git pull --ff-only origin feat/biap-global
          fi
          cd "$APP_DIR"
          python3 -m venv analysis/.venv-global
          analysis/.venv-global/bin/python -m pip install -q --upgrade pip
          analysis/.venv-global/bin/python -m pip install -q -r analysis/requirements.txt
          BIAP_GLOBAL_DATA_DIR=/var/lib/biap-global BIAP_GLOBAL_SERVICE_USER="$(id -un)" BIAP_GLOBAL_SERVICE_GROUP="$(id -gn)" bash deploy/setup-global-data.sh
          echo "Global checkout: $(git rev-parse --short HEAD)"
          echo "Iran production checkout/service were not touched."
          REMOTE
