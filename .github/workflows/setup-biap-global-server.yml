name: Setup BIAP Global server

on:
  push:
    branches: [feat/biap-global]
    paths:
      - 'analysis/global_markets/**'
      - 'analysis/global_routes.py'
      - 'analysis/global_api_server.py'
      - 'analysis/.env.global.example'
      - 'deploy/setup-global-data.sh'
      - 'deploy/sync-global-sources.sh'
      - 'deploy/configure-global-route.sh'
      - 'deploy/systemd/biap-global*.service'
      - 'deploy/systemd/biap-global*.timer'
      - '.github/workflows/setup-biap-global-server.yml'
  workflow_dispatch:

concurrency:
  group: biap-global-server-setup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q global_markets global_routes.py global_api_server.py
      - run: pytest -q tests/test_global_*.py

  setup-isolated-server:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '5.249.252.88' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      MARKET_KEY: ${{ secrets.BIAP_GLOBAL_MARKET_API_KEY || secrets.TWELVE_DATA_API_KEY }}
      SEC_ID: ${{ secrets.BIAP_SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
      EDINET_KEY: ${{ secrets.BIAP_EDINET_API_KEY || secrets.EDINET_API_KEY }}
      OPENDART_KEY: ${{ secrets.BIAP_OPENDART_API_KEY || secrets.OPENDART_API_KEY }}
      CH_KEY: ${{ secrets.BIAP_COMPANIES_HOUSE_API_KEY || secrets.COMPANIES_HOUSE_API_KEY }}
    steps:
      - name: Check isolated deploy credentials
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured" >&2; exit 1; }
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_global_key
          chmod 600 ~/.ssh/biap_global_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Prepare runtime provider overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          pairs = {
              "BIAP_GLOBAL_MARKET_API_KEY": os.environ.get("MARKET_KEY", ""),
              "BIAP_SEC_USER_AGENT": os.environ.get("SEC_ID", ""),
              "BIAP_EDINET_API_KEY": os.environ.get("EDINET_KEY", ""),
              "BIAP_OPENDART_API_KEY": os.environ.get("OPENDART_KEY", ""),
              "BIAP_COMPANIES_HOUSE_API_KEY": os.environ.get("CH_KEY", ""),
          }

          def quote(value: str) -> str:
              if "\n" in value or "\r" in value:
                  raise SystemExit("provider secret contains an unsupported newline")
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          lines = [f"{key}={quote(value.strip())}" for key, value in pairs.items() if value and value.strip()]
          path = Path("/tmp/biap-global-provider.env")
          path.write_text("\n".join(lines) + ("\n" if lines else ""), encoding="utf-8")
          path.chmod(0o600)
          print("Runtime provider credentials available:", len(lines))
          PY
      - name: Copy runtime provider overlay
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -i ~/.ssh/biap_global_key -P "$PORT" -o BatchMode=yes /tmp/biap-global-provider.env "$VPS_USER@$VPS_HOST:/tmp/biap-global-provider.env"
      - name: Prepare and publish separate Global service
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/biap_global_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/home/ubuntu/biap-global/BIAP
          PARENT=$(dirname "$APP_DIR")
          mkdir -p "$PARENT"
          if [[ ! -d "$APP_DIR/.git" ]]; then
            git clone --branch feat/biap-global --single-branch https://github.com/XS227/BIAP.git "$APP_DIR"
          else
            cd "$APP_DIR"
            if [[ -n "$(git status --porcelain)" ]]; then
              UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(deploy/configure-global-route\.sh|deploy/setup-global-data\.sh|deploy/sync-global-sources\.sh)$' || true)"
              if [[ -n "$UNEXPECTED" ]]; then
                echo "Refusing Global update: separate checkout has unexpected local changes" >&2
                git status --short
                exit 1
              fi
              echo "Resetting known deploy-script mode changes before update"
              git restore --worktree --staged -- deploy/configure-global-route.sh deploy/setup-global-data.sh deploy/sync-global-sources.sh
            fi
            if [[ -n "$(git status --porcelain)" ]]; then
              echo "Refusing Global update: checkout remains dirty after safe reset" >&2
              git status --short
              exit 1
            fi
            git fetch origin feat/biap-global
            git checkout feat/biap-global
            git pull --ff-only origin feat/biap-global
          fi
          cd "$APP_DIR"
          mkdir -p .runtime
          chmod +x deploy/setup-global-data.sh deploy/sync-global-sources.sh deploy/configure-global-route.sh
          python3 -m venv analysis/.venv-global
          analysis/.venv-global/bin/python -m pip install -q --upgrade pip
          analysis/.venv-global/bin/python -m pip install -q -r analysis/requirements.txt
          BIAP_GLOBAL_DATA_DIR=/var/lib/biap-global BIAP_GLOBAL_SERVICE_USER="$(id -un)" BIAP_GLOBAL_SERVICE_GROUP="$(id -gn)" bash deploy/setup-global-data.sh
          if [[ ! -f analysis/.env.global ]]; then
            cp analysis/.env.global.example analysis/.env.global
          fi
          if [[ -s /tmp/biap-global-provider.env ]]; then
            while IFS='=' read -r key _rest; do
              [[ "$key" =~ ^[A-Z0-9_]+$ ]] || continue
              sed -i "/^${key}=/d" analysis/.env.global
            done < /tmp/biap-global-provider.env
            cat /tmp/biap-global-provider.env >> analysis/.env.global
          fi
          rm -f /tmp/biap-global-provider.env
          chmod 600 analysis/.env.global
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          $SUDO install -m 0644 deploy/systemd/biap-global.service /etc/systemd/system/biap-global.service
          $SUDO install -m 0644 deploy/systemd/biap-global-source-sync.service /etc/systemd/system/biap-global-source-sync.service
          $SUDO install -m 0644 deploy/systemd/biap-global-source-sync.timer /etc/systemd/system/biap-global-source-sync.timer
          $SUDO systemctl daemon-reload
          $SUDO systemctl enable --now biap-global.service
          $SUDO systemctl restart biap-global.service
          $SUDO systemctl enable --now biap-global-source-sync.timer
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8091/health >/tmp/biap-global-health.json; then
              cat /tmp/biap-global-health.json
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8091/health >/dev/null
          bash deploy/configure-global-route.sh
          $SUDO systemctl list-timers --all biap-global-source-sync.timer --no-pager || true
          echo "Global checkout: $(git rev-parse --short HEAD)"
          echo "Global local health OK. Iran production checkout/service were not touched."
          REMOTE
      - name: Verify public Global route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://biap.dadashi.no/global-api/health | tee /tmp/global-health.json
          curl --fail --silent --show-error --max-time 15 https://biap.dadashi.no/global-api/global/countries > /tmp/global-countries.json
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/global-health.json',encoding='utf-8'))
          countries=json.load(open('/tmp/global-countries.json',encoding='utf-8'))
          assert health.get('service') == 'biap-global'
          assert health.get('productionIranModified') is False
          assert int(countries.get('count',0)) >= 20
          print('Public BIAP Global route OK:', countries['count'], 'country packs')
          PY
