name: BIAP Global BSE SCRIP zip probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-bse-scrip-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Inspect official BSE SCRIP zip
        run: |
          python - <<'PY'
          import csv, io, zipfile, requests
          url='https://www.bseindia.com/download/BhavCopy/Equity/BSE_EQ_BHAVCOPY_22092026.ZIP'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bseindia.com/'},timeout=60)
          print('STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'))
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          names=[n for n in z.namelist() if not n.endswith('/')]
          print('COUNT',len(names))
          print('FIRST',names[:20])
          print('LAST',names[-30:])
          for name in names:
              b=z.read(name)
              print('FILE',name,'BYTES',len(b),'HEAD',repr(b[:1000]))
              try:
                  text=b.decode('utf-8-sig')
              except UnicodeDecodeError:
                  text=b.decode('cp1252','replace')
              rows=list(csv.DictReader(io.StringIO(text)))
              from collections import Counter
              print('ROWS',len(rows),'FIELDS',list(rows[0]) if rows else [])
              print('FIN_TYPES',Counter(x.get('FinInstrmTp','') for x in rows).most_common())
              print('SERIES',Counter(x.get('SctySrs','') for x in rows).most_common(80))
              print('ZERO_VOL',sum(float(x.get('TtlTradgVol') or 0)==0 for x in rows))
              print('ZERO_TX',sum(float(x.get('TtlNbOfTxsExctd') or 0)==0 for x in rows))
              print('ISIN_EMPTY',sum(not (x.get('ISIN') or '').strip() for x in rows))
              for needle in ('NIFTYBEES','GOLDBEES','EMBASSY','POWERGRID INVIT','RELIANCE','TCS','BRIGHTCOM'):
                  found=[x for x in rows if needle in ((x.get('TckrSymb') or '')+' '+(x.get('FinInstrmNm') or '')).upper()]
                  print('MATCH',needle,found[:8])
          PY
