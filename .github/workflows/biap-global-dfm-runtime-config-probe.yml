name: BIAP Global DFM runtime config probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-dfm-runtime-config-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Locate DFM resource host
        shell: bash
        run: |
          python - <<'PY'
          import re,requests
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          urls=[
              'https://www.dfm.ae/the-exchange/market-information/company/DEWA/reports/financial-reports',
              'https://www.dfm.ae/_nuxt/D-LIC8Ni.js',
              'https://www.dfm.ae/_nuxt/AGRv68WG.js',
          ]
          for url in urls:
              r=requests.get(url,headers={'User-Agent':ua},timeout=45)
              print('DOC',url,r.status_code,len(r.content))
              text=r.text
              for needle in ('dfmResourcePath','apiEfsahUrl','resourcePath','efsahresources','efsah_resource'):
                  for m in list(re.finditer(re.escape(needle),text,re.I))[:20]:
                      print('CONFIG_CTX',needle,text[max(0,m.start()-1800):m.start()+3000])
              for m in re.finditer(r'https?://[^"\'<> ]+',text):
                  u=m.group(0)
                  if any(k in u.lower() for k in ('efsah','resource','disclosure')):
                      print('CONFIG_URL',u[:1000])
          PY
