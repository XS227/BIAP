name: BIAP Global TLS diagnostics

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-tls-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '5.249.252.88' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: External TLS checks
        shell: bash
        run: |
          set -euxo pipefail
          echo | openssl s_client -connect biap.dadashi.no:443 -servername biap.dadashi.no -showcerts 2>&1 | sed -n '1,120p'
          curl -Iv --tlsv1.2 --max-time 15 https://biap.dadashi.no/global-api/health || true
          curl -Iv --tlsv1.3 --max-time 15 https://biap.dadashi.no/global-api/health || true
          python3 - <<'PY'
          import socket, ssl
          ctx=ssl.create_default_context()
          with socket.create_connection(('biap.dadashi.no',443),timeout=10) as s:
              with ctx.wrap_socket(s,server_hostname='biap.dadashi.no') as ss:
                  print('python_tls', ss.version(), ss.cipher())
                  print('peer_subject', ss.getpeercert().get('subject'))
          PY
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_tls_key
          chmod 600 ~/.ssh/biap_tls_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Server TLS configuration summary
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/biap_tls_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          echo '--- nginx TLS summary ---'
          $SUDO nginx -T 2>/dev/null | grep -E 'server_name[[:space:]]+biap\.dadashi\.no|listen[[:space:]].*443|ssl_certificate(_key)?[[:space:]]|ssl_protocols[[:space:]]|ssl_ciphers[[:space:]]' | head -80 || true
          echo '--- certificate ---'
          CERT=$($SUDO nginx -T 2>/dev/null | awk '/ssl_certificate[[:space:]]+.*fullchain\.pem/ {gsub(";",""); print $2; exit}')
          if [[ -n "$CERT" && -f "$CERT" ]]; then
            $SUDO openssl x509 -in "$CERT" -noout -subject -issuer -dates -serial -fingerprint -sha256
            $SUDO openssl verify "$CERT" || true
          fi
          echo '--- local/global health ---'
          curl -fsS --max-time 5 http://127.0.0.1:8091/health
          curl -fsS --max-time 10 https://biap.dadashi.no/global-api/health
          REMOTE
