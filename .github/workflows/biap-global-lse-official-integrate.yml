name: BIAP Global LSE official integration

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-lse-official-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply LSE integration
        run: python tools/apply_lse_official_integration.py
      - name: Install backend dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Compile and test Global backend
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Verify LSE runtime wiring without network
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from global_markets.runtime import build_registry
          from global_markets.scanner import GlobalMarketScanner
          r=build_registry()
          p=r.universe('GB','LSE')
          u=getattr(p,'upstream',p)
          assert getattr(u,'provider_id',None)=='official-lse-main-market-shares'
          s=GlobalMarketScanner()
          assert s.lse_official.supported('GB','LSE')
          print('LSE_RUNTIME_OK',getattr(p,'provider_id',None),getattr(u,'provider_id',None))
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/lse_official.py analysis/global_markets/runtime.py analysis/global_markets/scanner.py analysis/tests/test_global_lse_official.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use official LSE Main Market shares and prices'
          git push origin HEAD:feat/biap-global
