name: BIAP Global HK SG production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-hk-sg-production-smoke.yml'
      - 'analysis/global_markets/hkex_issuer.py'
      - 'analysis/global_markets/sgx_issuer.py'
      - 'analysis/global_markets/runtime.py'
      - 'analysis/global_routes.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify HKEX and SGX issuer official fundamentals
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          cases=[
              ('HK','HKEX','388','HKD','2025-12-31','hkex-official-issuer-financial-statements'),
              ('SG','SGX','S68','SGD','2026-06-30','sgx-official-issuer-financial-information'),
          ]
          for country,exchange,ticker,currency,period,provider in cases:
              r=s.get(f'{base}/instruments/{country}/{exchange}',params={'q':ticker,'limit':5},timeout=90)
              print('SEARCH',ticker,r.status_code,r.text[:12000])
              r.raise_for_status()
              rows=r.json().get('instruments') or []
              exact=[x for x in rows if str(x.get('ticker') or '').lstrip('0').upper()==ticker.lstrip('0').upper()]
              assert exact, rows
              row=exact[0]
              payload={'country':country,'exchange':exchange,'ticker':row.get('ticker') or ticker,
                       'name':row.get('name'),'currency':row.get('currency') or currency,
                       'isin':row.get('isin'),'lei':row.get('lei')}
              a=s.post(base+'/analyze',json=payload,timeout=180)
              print('ANALYZE',ticker,a.status_code,a.text[:35000])
              a.raise_for_status()
              data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
              assert any(x.get('provider')==provider for x in sources), sources
              assert any(str(x.get('source_type') or '').startswith('official_issuer_') for x in sources), sources
              assert company.get('filing_period_end') == period, company
              assert company.get('revenue') is not None, company
              assert company.get('net_income') is not None, company
              evidence=data.get('evidence') or {}
              missing=evidence.get('missing_critical') or []
              assert 'fundamental_source' not in missing, evidence
              assert evidence.get('status') in {'PASS','WARN'}, evidence
              print('OK',ticker,provider,period,evidence.get('status'),missing)
          PY
