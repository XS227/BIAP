name: BIAP Global domestic official universe scope

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-domestic-official-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0

      - name: Apply domestic scope patch
        run: python tools/apply_domestic_official_scope.py

      - name: Install dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt

      - name: Compile and test
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py

      - name: Validate domestic official universes live
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from global_markets.official_universe import DeutscheBoerseUniverseProvider, ASXUniverseProvider

          de=DeutscheBoerseUniverseProvider(timeout=45)
          xetra=list(de.list_instruments(country='DE', exchange='XETRA'))
          frankfurt=list(de.list_instruments(country='DE', exchange='FRANKFURT'))
          asx=list(ASXUniverseProvider(timeout=45).list_instruments(country='AU', exchange='ASX'))

          print('XETRA domestic',len(xetra),'sample',[(x.ticker,x.name,x.isin) for x in xetra[:12]])
          print('FRANKFURT domestic',len(frankfurt),'sample',[(x.ticker,x.name,x.isin) for x in frankfurt[:12]])
          print('ASX domestic',len(asx),'sample',[(x.ticker,x.name,x.isin) for x in asx[:12]])

          assert len(xetra) > 250, len(xetra)
          assert len(frankfurt) > 250, len(frankfurt)
          assert len(asx) > 1500, len(asx)
          assert all((x.isin or '').startswith('DE') for x in xetra)
          assert all((x.isin or '').startswith('DE') for x in frankfurt)
          assert all((x.isin or '').startswith('AU') for x in asx)
          assert {'SAP','SIE','BMW'} <= {x.ticker for x in xetra}
          assert {'BHP','CBA','CSL'} <= {x.ticker for x in asx}
          PY

      - name: Commit domestic scope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/official_universe.py analysis/global_markets/cached_universe.py
          git diff --cached --quiet && exit 0
          git commit -m 'Scope official market universes to domestic equities'
          git push origin HEAD:feat/biap-global
