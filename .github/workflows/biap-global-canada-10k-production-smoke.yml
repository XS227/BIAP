name: BIAP Global Canada 10-K production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-canada-10k-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify Canadian cross-listed SEC 10-K fundamentals in production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          ticker='SHOP'
          r=s.get(base+'/instruments/CA/TSX',params={'q':ticker,'limit':10},timeout=90)
          print('SEARCH',r.status_code,r.text[:12000])
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
          assert exact, rows
          row=exact[0]
          payload={'country':'CA','exchange':'TSX','ticker':ticker,'name':row.get('name'),
                   'currency':row.get('currency') or 'CAD','isin':row.get('isin'),'lei':row.get('lei')}
          a=s.post(base+'/analyze',json=payload,timeout=210)
          print('ANALYZE',a.status_code,a.text[:40000])
          a.raise_for_status()
          data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
          official=[x for x in sources if x.get('provider')=='sec-edgar-crosslisted-10k-usgaap-cached']
          assert official, sources
          assert any(x.get('source_type')=='official_regulatory_xbrl' for x in official), official
          assert company.get('filing_period_end') == '2025-12-31', company
          assert company.get('reporting_currency') == 'USD', company
          assert company.get('revenue') is not None and company.get('revenue') > 0, company
          assert company.get('net_income') is not None, company
          assert company.get('total_assets') is not None, company
          evidence=data.get('evidence') or {}
          missing=evidence.get('missing_critical') or []
          assert 'fundamental_source' not in missing, evidence
          assert evidence.get('status') in {'PASS','WARN'}, evidence
          print('OK SHOP SEC 10-K official fundamentals',
                company.get('filing_period_end'),company.get('reporting_currency'),
                company.get('revenue'),company.get('net_income'),
                company.get('total_assets'),evidence.get('status'),missing)
          PY
