name: BIAP Global SIX official source probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-six-official-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe SIX official equity issuer JSON and CSV
        run: |
          python -m pip install -q requests
          python - <<'PY'
          import csv, io, json, requests
          base="https://www.six-group.com"
          s=requests.Session()
          s.headers.update({
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language":"en-US,en;q=0.9",
              "Referer":"https://www.six-group.com/en/market-data/shares/companies.html",
          })
          for path in (
              "/sheldon/equity_issuers/v1/equity_issuers.json",
              "/sheldon/equity_issuers/v1/equity_issuers.csv",
          ):
              r=s.get(base+path,timeout=40)
              print("\nURL",path,"status",r.status_code,"type",r.headers.get("content-type"),"bytes",len(r.content))
              r.raise_for_status()
              if path.endswith(".json"):
                  p=r.json()
                  print("TOP_KEYS",list(p)[:20] if isinstance(p,dict) else type(p).__name__)
                  rows=p.get("itemList") if isinstance(p,dict) else None
                  print("COUNT",len(rows or []))
                  print("SAMPLE",json.dumps((rows or [])[:12],ensure_ascii=False,indent=2))
                  ch=[x for x in (rows or []) if str(x.get("country") or "").upper() in {"CH","SWITZERLAND"}]
                  primary=[x for x in ch if x.get("primaryListing") is True]
                  print("CH_COUNT",len(ch),"CH_PRIMARY",len(primary))
                  print("CH_PRIMARY_SAMPLE",json.dumps(primary[:20],ensure_ascii=False,indent=2))
                  print("CLASS_COUNTS",json.dumps({
                      str(k):sum(1 for x in primary if x.get("classOfShare")==k)
                      for k in sorted({x.get("classOfShare") for x in primary},key=lambda z:str(z))
                  },ensure_ascii=False,indent=2))
                  print("CURRENCY_COUNTS",json.dumps({
                      str(k):sum(1 for x in primary if x.get("tradingCurrency")==k)
                      for k in sorted({x.get("tradingCurrency") for x in primary},key=lambda z:str(z))
                  },ensure_ascii=False,indent=2))
              else:
                  text=r.content.decode("utf-8-sig","replace")
                  reader=csv.reader(io.StringIO(text))
                  for i,row in enumerate(reader):
                      print("CSV_ROW",i+1,json.dumps(row,ensure_ascii=False))
                      if i>=8: break
          PY
