name: BIAP Global SIX official source probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-six-official-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect SIX issuer React data endpoints
        run: |
          python -m pip install -q requests beautifulsoup4
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          page="https://www.six-group.com/en/market-data/shares/companies.html"
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept-Language":"en-US,en;q=0.9"})
          r=s.get(page,timeout=40)
          soup=BeautifulSoup(r.text,"html.parser")
          scripts=[urljoin(r.url,x.get("src")) for x in soup.find_all("script",src=True)]
          target=next(x for x in scripts if "shares-list-of-companies" in x)
          js=s.get(target,timeout=40)
          print("TARGET",target,js.status_code,len(js.text))
          body=js.text
          # Print string literals and nearby contexts that look like data/API/CSV routes.
          strings=sorted(set(re.findall(r'["\']([^"\']{4,400})["\']',body)))
          for val in strings:
              low=val.lower()
              if any(k in low for k in ["http","api","csv","companies","issuer","download","share"]):
                  print("STRING",val[:1000])
          for needle in ["axios","fetch(","csv","download","companies","primaryListing","primary_listing","api/"]:
              start=0
              while True:
                  pos=body.find(needle,start)
                  if pos<0: break
                  print("\nCTX",needle,pos,body[max(0,pos-1200):pos+2800])
                  start=pos+len(needle)
                  if start>pos+20000: break
          # Extract likely relative endpoint tokens.
          for pat in [
              r'/[^"\' ]+(?:\.json|\.csv|/search|/list|/companies)[^"\' ]*',
              r'https?://[^"\' ]+',
          ]:
              for val in sorted(set(re.findall(pat,body))):
                  print("ENDPOINT",val[:1000])
          PY
