name: BIAP Global BME daily bulletin probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-bme-daily-bulletin-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests openpyxl
      - run: |
          python - <<'PY'
          import io, json, requests, openpyxl
          url='https://www.bolsasymercados.es/dam/descargas/exchange/renta-variable/bdiario.xlsx'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 BIAP-Global'},timeout=60)
          print('HTTP',r.status_code,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content),'FINAL',r.url)
          r.raise_for_status()
          wb=openpyxl.load_workbook(io.BytesIO(r.content),read_only=True,data_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              print('SHEET',ws.title,'ROWS',ws.max_row,'COLS',ws.max_column)
              for i,row in enumerate(ws.iter_rows(values_only=True)):
                  vals=[v for v in row]
                  print('ROW',i+1,json.dumps(vals,ensure_ascii=False,default=str))
                  if i>=24:
                      break
          PY
