name: BIAP Global cache warm

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-cache-warm.yml'

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '5.249.252.88' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_global_key
          chmod 600 ~/.ssh/biap_global_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Warm US Europe and Türkiye server cache
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/biap_global_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/home/ubuntu/biap-global/BIAP
          cd "$APP_DIR/analysis"
          set -a
          [[ -f .env.global ]] && source .env.global
          set +a
          export PYTHONPATH="$APP_DIR/analysis"
          export BIAP_GLOBAL_DATA_DIR="${BIAP_GLOBAL_DATA_DIR:-/var/lib/biap-global}"
          mkdir -p "$BIAP_GLOBAL_DATA_DIR/fundamentals"
          .venv-global/bin/python -m global_markets.official_cache_warm | tee /tmp/biap-global-cache-warm.json
          echo "fundamentals_latest_files=$(find "$BIAP_GLOBAL_DATA_DIR/fundamentals" -type f -name latest.json 2>/dev/null | wc -l)"
          echo "fundamentals_period_files=$(find "$BIAP_GLOBAL_DATA_DIR/fundamentals" -type f -path '*/history/*.json' 2>/dev/null | wc -l)"
          REMOTE
