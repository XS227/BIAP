name: BIAP Global official universe source probe v2

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-official-universe-source-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Nasdaq Nordic API filters and exchange selectors
        run: |
          python - <<'PY'
          import json, requests
          base='https://api.nasdaq.com/api/nordic/screener/shares'
          headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'en-US,en;q=0.9',
          }
          common=[('category','MAIN_MARKET'),('tableonly','true'),('page','1'),('size','1000'),
                  ('segment','LARGE_CAP'),('segment','MID_CAP'),('segment','SPAC'),('segment','SMALL_CAP'),('lang','en')]

          def get(extra=()):
              r=requests.get(base,params=common+list(extra),headers=headers,timeout=45)
              obj={'status':r.status_code,'url':r.url,'bytes':len(r.content)}
              if not r.ok:
                  obj['text']=r.text[:500]; return obj
              p=r.json(); data=p.get('data') or {}; il=data.get('instrumentListing') or {}
              rows=il.get('rows') or []
              obj['dataKeys']=list(data.keys())
              obj['listingKeys']=list(il.keys())
              obj['rowCount']=len(rows)
              obj['meta']={k:v for k,v in data.items() if k!='instrumentListing'}
              obj['listingMeta']={k:v for k,v in il.items() if k not in ('rows','headers')}
              wanted={}
              for needle in ('NOKIA','KONE','MAERSK','NOVO','VOLVO','ERICSSON','MAREL','ARION','ICELANDAIR','SÍMINN','SIMINN'):
                  hits=[x for x in rows if needle in (str(x.get('fullName',''))+' '+str(x.get('symbol',''))).upper()]
                  if hits: wanted[needle]=hits[:3]
              obj['knownHits']=wanted
              obj['sample']=rows[:2]
              return obj

          cases={
              'base':(),
              'market_Helsinki':(('market','Helsinki'),),
              'market_Stockholm':(('market','Stockholm'),),
              'market_Copenhagen':(('market','Copenhagen'),),
              'market_Iceland':(('market','Iceland'),),
              'exchange_Helsinki':(('exchange','Helsinki'),),
              'country_Finland':(('country','Finland'),),
              'mic_XHEL':(('mic','XHEL'),),
          }
          out={k:get(v) for k,v in cases.items()}
          print(json.dumps(out,indent=2,ensure_ascii=False)[:60000])
          PY
