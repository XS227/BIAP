name: BIAP Global official universe source probe v2

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-official-universe-source-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read official Nasdaq Nordic screener filters
        run: |
          python - <<'PY'
          import json, requests
          url='https://api.nasdaq.com/api/nordic/screener/shares'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'en-US,en;q=0.9'
          }
          variants={
            'no_tableonly':[('category','MAIN_MARKET'),('page','1'),('size','5'),('lang','en')],
            'tableonly_false':[('category','MAIN_MARKET'),('tableonly','false'),('page','1'),('size','5'),('lang','en')],
            'no_category':[('page','1'),('size','5'),('lang','en')],
          }
          out={}
          for name,params in variants.items():
            r=requests.get(url,params=params,headers=headers,timeout=45)
            item={'status':r.status_code,'url':r.url,'bytes':len(r.content)}
            if r.ok:
              p=r.json(); data=p.get('data') or {}
              item['dataKeys']=list(data.keys())
              item['filters']=data.get('filters')
              item['pagination']=data.get('pagination')
              il=data.get('instrumentListing') or {}
              item['rowCount']=len(il.get('rows') or [])
              item['sample']=(il.get('rows') or [])[:2]
            else:
              item['text']=r.text[:1000]
            out[name]=item
          print(json.dumps(out,indent=2,ensure_ascii=False)[:80000])
          PY
