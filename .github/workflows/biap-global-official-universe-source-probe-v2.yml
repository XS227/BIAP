name: BIAP Global official universe source probe v2

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-official-universe-source-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Nasdaq Nordic main-market API and Euronext regulated CSV
        run: |
          python - <<'PY'
          import csv, io, json, requests

          headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'en-US,en;q=0.9',
          }

          out={'nasdaq':{},'euronext':{}}

          nurl='https://api.nasdaq.com/api/nordic/screener/shares'
          params=[
              ('category','MAIN_MARKET'),('tableonly','true'),('page','1'),('size','1000'),
              ('segment','LARGE_CAP'),('segment','MID_CAP'),('segment','SPAC'),('segment','SMALL_CAP'),('lang','en')
          ]
          r=requests.get(nurl,params=params,headers=headers,timeout=45)
          out['nasdaq']['status']=r.status_code
          out['nasdaq']['contentType']=r.headers.get('content-type')
          out['nasdaq']['bytes']=len(r.content)
          if r.ok:
              p=r.json()
              out['nasdaq']['topKeys']=list(p.keys()) if isinstance(p,dict) else []
              data=p.get('data') if isinstance(p,dict) else {}
              il=(data or {}).get('instrumentListing') or {}
              rows=il.get('rows') or []
              out['nasdaq']['rowCount']=len(rows)
              out['nasdaq']['headers']=il.get('headers')
              out['nasdaq']['sample']=rows[:5]
              markets={}
              for row in rows:
                  if not isinstance(row,dict): continue
                  blob=' | '.join(str(v) for v in row.values())
                  for label in ('Stockholm','Helsinki','Copenhagen','Iceland'):
                      if label.lower() in blob.lower():
                          markets[label]=markets.get(label,0)+1
              out['nasdaq']['marketTextCounts']=markets

          eheaders={
              'User-Agent':'BIAP Global official universe probe (+https://setai.no)',
              'Accept':'text/csv,*/*',
              'Referer':'https://live.euronext.com/en/products/equities/regulated/list',
          }
          eurl='https://live.euronext.com/en/product_directory/data/stocks-euronext-regulated/download'
          er=requests.get(eurl,headers=eheaders,timeout=60)
          out['euronext']['status']=er.status_code
          out['euronext']['contentType']=er.headers.get('content-type')
          out['euronext']['bytes']=len(er.content)
          if er.ok:
              text=er.content.decode('utf-8-sig',errors='replace')
              rows=[]
              try:
                  rd=csv.DictReader(io.StringIO(text),delimiter=';')
                  rows=[x for x in rd if isinstance(x,dict)]
              except Exception as exc:
                  out['euronext']['csvError']=repr(exc)
              usable=[]
              markets={}
              dublin=[]
              for raw in rows:
                  isin=str(raw.get('ISIN') or '').strip().upper()
                  sym=str(raw.get('Symbol') or '').strip().upper()
                  market=str(raw.get('Market') or '').strip()
                  if len(isin)==12 and isin.isalnum() and sym:
                      usable.append(raw)
                      markets[market]=markets.get(market,0)+1
                      if 'Dublin' in market or 'Ireland' in market or 'XMSM' in market:
                          dublin.append({k:raw.get(k) for k in ('Name','ISIN','Symbol','Market','Currency')})
              out['euronext']['usableRows']=len(usable)
              out['euronext']['marketCounts']=markets
              out['euronext']['dublinCount']=len(dublin)
              out['euronext']['dublinSample']=dublin[:20]

          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
