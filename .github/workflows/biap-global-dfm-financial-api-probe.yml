name: BIAP Global DFM financial reports API probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-dfm-financial-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Inspect DFM financial reports component
        shell: bash
        run: |
          python - <<'PY'
          import re,requests
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          url='https://www.dfm.ae/_nuxt/BXMYWIU_2.js'
          body=requests.get(url,headers={'User-Agent':ua},timeout=45).text
          print('STATUS','BYTES',len(body))
          for needle in ('apiBaseUrl','apiSfUrl','apiEfsahUrl','Command=','financial','reports','disclosure','$fetch','fetch('):
              seen=0
              for m in re.finditer(re.escape(needle),body,re.I):
                  print('CTX',needle,body[max(0,m.start()-2500):m.start()+5000])
                  seen+=1
                  if seen>=12: break
          PY
