name: BIAP Global Deutsche Boerse ERS API probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-db-ers-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover official Deutsche Boerse company-details API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests, urllib.parse
          page='https://live.deutsche-boerse.com/equity/sap-se/company-details'
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'}
          s=requests.Session()
          r=s.get(page,headers=h,timeout=45)
          print('PAGE',r.status_code,len(r.text),r.url)
          r.raise_for_status()
          html=r.text
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              url=urllib.parse.urljoin(page,src)
              if url not in scripts:
                  scripts.append(url)
          print('SCRIPTS',len(scripts))
          needles=('api.live.deutsche-boerse.com','company-report','company_report','companyreports',
                   'companyDetails','company-details','financial-report','financialReport',
                   'issuer','erscontent','reports')
          hits=[]
          for i,url in enumerate(scripts):
              try:
                  rr=s.get(url,headers=h,timeout=45)
                  if rr.status_code != 200:
                      continue
                  text=rr.text
              except Exception as e:
                  print('SCRIPT_ERR',url,type(e).__name__)
                  continue
              low=text.lower()
              if not any(n.lower() in low for n in needles):
                  continue
              print('SCRIPT',i,url,'LEN',len(text))
              # Print compact windows around API base / report-related strings.
              for pattern in (
                  r'https://api\.live\.deutsche-boerse\.com[^"\'\\ ]*',
                  r'/v1/[^"\'\\ ]*(?:report|company|issuer)[^"\'\\ ]*',
                  r'[^"\']{0,180}(?:companyreports|company-reports|financialreports|financial-reports|erscontent)[^"\']{0,260}',
              ):
                  for m in re.finditer(pattern,text,re.I):
                      frag=' '.join(m.group(0).split())
                      if frag not in hits:
                          hits.append(frag)
                          print('HIT',frag[:900])
                          if len(hits)>=120:
                              break
                  if len(hits)>=120:
                      break
              if len(hits)>=120:
                  break
          print('TOTAL_HITS',len(hits))
          # Inspect raw server HTML / hydration state for official report data.
          probes=('Half-yearly financial report','companyReports','company-reports',
                  'financialReports','financial-reports','erscontent','DE0007164600',
                  'sap-2026-half-year-report','api.live.deutsche-boerse.com')
          for needle in probes:
              pos=html.lower().find(needle.lower())
              print('HTML_PROBE',needle,'POS',pos)
              if pos >= 0:
                  frag=' '.join(html[max(0,pos-700):pos+1800].split())
                  print('HTML_HIT',needle,frag[:2500])
          for pat in (
              r"https?://[^\\"'<> ]+\\.pdf[^\\"'<> ]*",
              r"https?://api\\.live\\.deutsche-boerse\\.com[^\\"'<> ]*",
              r"https?://erscontent\\.deutsche-boerse\\.com[^\\"'<> ]*",
          ):
              vals=[]
              for m in re.finditer(pat,html,re.I):
                  v=m.group(0).replace('&amp;','&')
                  if v not in vals:
                      vals.append(v)
              print('HTML_URLS',pat,'COUNT',len(vals))
              for v in vals[:30]:
                  print('URL',v)
          PY
