name: BIAP Global Saudi static and BSE bhav probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-saudi-bse-final-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Probe Saudi static reports and BSE current bhavcopy
        run: |
          python - <<'PY'
          import requests,re,datetime,zipfile,io
          H={'User-Agent':'Mozilla/5.0 BIAP-Global','Accept':'text/html,application/zip,*/*'}
          for name,url in [
            ('SA_MAIN','https://www.saudiexchange.sa/Resources/Reports-v2/DetailedDaily_en.html'),
            ('SA_NOMU','https://www.saudiexchange.sa/Resources/Reports-v2/DetailedDailySme_en.html'),
          ]:
              r=requests.get(url,headers=H,timeout=45)
              print(name,'STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'))
              print(name,'DATE',re.findall(r'Market Date.{0,200}',r.text,re.I|re.S)[:2])
              for needle in ('2222','ALJAZIRA REIT','9513','REIT'):
                  p=r.text.upper().find(needle.upper())
                  if p>=0: print(name,'CTX',needle,r.text[max(0,p-1200):p+2200])
          # Probe likely current BSE bhavcopy URL patterns for last 10 calendar days.
          today=datetime.date.today()
          for d in [today-datetime.timedelta(days=i) for i in range(0,12)]:
              dd=d.strftime('%d%m%Y'); dd6=d.strftime('%d%m%y')
              urls=[
                f'https://www.bseindia.com/download/BhavCopy/Equity/BSE_EQ_BHAVCOPY_{dd}.ZIP',
                f'https://www.bseindia.com/download/BhavCopy/Equity/EQ{dd6}_CSV.ZIP',
                f'https://www.bseindia.com/download/BhavCopy/Equity/EQ_ISINCODE_{dd6}.zip',
                f'https://www.bseindia.com/download/BhavCopy/Equity/BhavCopy_BSE_CM_0_0_0_{dd}_F_0000.CSV',
              ]
              for url in urls:
                  try:
                      rr=requests.get(url,headers={**H,'Referer':'https://www.bseindia.com/markets/MarketInfo/BhavCopy.aspx'},timeout=20)
                      ctype=rr.headers.get('content-type') or ''
                      if rr.status_code==200 and (rr.content[:2]==b'PK' or 'csv' in ctype.lower() or (len(rr.content)>50000 and 'html' not in ctype.lower())):
                          print('BSE_HIT',url,'STATUS',rr.status_code,'BYTES',len(rr.content),'TYPE',ctype,'HEAD',repr(rr.content[:300]))
                          if rr.content[:2]==b'PK':
                              z=zipfile.ZipFile(io.BytesIO(rr.content)); print('ZIP',z.namelist()[:10])
                  except Exception as e: print('BSE_ERR',url,type(e).__name__)
          PY
