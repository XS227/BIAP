name: BIAP Global FIRDS Euronext cache v11

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-firds-euronext-cache-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply cache migration
        run: python tools/apply_firds_euronext_cache_v11.py
      - name: Install backend dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Compile and test Global backend
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Commit cache migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/cached_universe.py analysis/tests/test_global_universe_cache_schema.py
          git diff --cached --quiet && exit 0
          git commit -m 'Invalidate pre-Euronext FIRDS resolver caches'
          git push origin HEAD:feat/biap-global
