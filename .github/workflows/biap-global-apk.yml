name: BIAP Global APK

on:
  push:
    branches: [feat/biap-global]
    paths:
      - 'mobile/**'
      - '.github/workflows/biap-global-apk.yml'
  workflow_dispatch:

concurrency:
  group: biap-global-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_BIAP_GLOBAL_PREVIEW: '1'
      EXPO_PUBLIC_BIAP_GLOBAL_API_BASE: 'https://biap.dadashi.no/global-api'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo doctor (advisory patch-version check)
        shell: bash
        run: |
          set +e
          npx expo-doctor
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            echo "::warning::expo-doctor reported SDK patch-version drift. TypeScript passed; continue preview build and verify Gradle output."
          fi
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Apply Android network compatibility
        run: python3 scripts/patch-android-network-compat.py
      - name: Configure arm64 signed preview
        run: |
          test -f android/app/debug.keystore
          printf '\nreactNativeArchitectures=arm64-v8a\n' >> android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          marker = 'release {'
          if marker not in text:
              raise SystemExit('release build type not found')
          head, tail = text.split(marker, 1)
          block = tail.split('}', 1)[0]
          if 'signingConfig signingConfigs.debug' not in block:
              text = head + marker + '\n            signingConfig signingConfigs.debug' + tail
              path.write_text(text, encoding='utf-8')
          PY
      - name: Build arm64 release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=4
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Name APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "BIAP-Global-${VERSION}-arm64.apk"
          sha256sum "BIAP-Global-${VERSION}-arm64.apk" > "BIAP-Global-${VERSION}-arm64.apk.sha256"
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-global-android-arm64-${{ github.sha }}
          path: |
            mobile/BIAP-Global-*-arm64.apk
            mobile/BIAP-Global-*-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
