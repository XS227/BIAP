# Dynamic-version BIAP Global APK build: 2026-09-23
name: BIAP Global APK

on:
  push:
    branches: [feat/biap-global]
    paths:
      - 'mobile/**'
      - '.github/workflows/biap-global-apk.yml'
  workflow_dispatch:

concurrency:
  group: biap-global-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_BIAP_GLOBAL_PREVIEW: '1'
      EXPO_PUBLIC_BIAP_GLOBAL_API_BASE: 'https://biap.dadashi.no/global-api'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo doctor (advisory patch-version check)
        shell: bash
        run: |
          set +e
          npx expo-doctor
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            echo "::warning::expo-doctor reported SDK patch-version drift. TypeScript passed; continue preview build and verify Gradle output."
          fi
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Apply Android network compatibility
        run: python3 scripts/patch-android-network-compat.py
      - name: Configure signed universal preview
        run: |
          test -f android/app/debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          marker = 'release {'
          if marker not in text:
              raise SystemExit('release build type not found')
          head, tail = text.split(marker, 1)
          block = tail.split('}', 1)[0]
          if 'signingConfig signingConfigs.debug' not in block:
              text = head + marker + '\n            signingConfig signingConfigs.debug' + tail
              path.write_text(text, encoding='utf-8')
          PY
      - name: Build universal release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=4
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Verify upgrade signer continuity
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test -n "$NEW_CERT"
          echo "New APK signer SHA-256: $NEW_CERT"
          if curl --fail --silent --show-error --location --max-time 90 \
            https://biap.dadashi.no/global/download/BIAP-Global-latest.apk \
            -o /tmp/biap-global-current.apk; then
            OLD_CERT=$("$APKSIGNER" verify --print-certs /tmp/biap-global-current.apk | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
            test -n "$OLD_CERT"
            echo "Installed-channel signer SHA-256: $OLD_CERT"
            test "$NEW_CERT" = "$OLD_CERT" || {
              echo "::error::APK signer changed; Android would reject an in-place update over the installed BIAP Global build."
              exit 1
            }
            echo "APK signer continuity verified for in-place update."
          else
            echo "::warning::Current public APK could not be downloaded; signer continuity comparison skipped."
          fi
      - name: Name APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          EXPECTED_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          cp android/app/build/outputs/apk/release/app-release.apk "BIAP-Global-${VERSION}-universal.apk"
          sha256sum "BIAP-Global-${VERSION}-universal.apk" > "BIAP-Global-${VERSION}-universal.apk.sha256"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "BIAP-Global-${VERSION}-universal.apk" | tee /tmp/biap-global-badging.txt
          grep -q "package: name='com.biap.global'" /tmp/biap-global-badging.txt
          grep -q "versionCode='${EXPECTED_CODE}'" /tmp/biap-global-badging.txt
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-global-android-universal-${{ github.sha }}
          path: |
            mobile/BIAP-Global-*-universal.apk
            mobile/BIAP-Global-*-universal.apk.sha256
          if-no-files-found: error
          retention-days: 30
