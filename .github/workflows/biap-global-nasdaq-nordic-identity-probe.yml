name: BIAP Global Nasdaq Nordic identity probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-nasdaq-nordic-identity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install -q requests openpyxl
      - name: Search whole official workbook for ticker ISIN and company identities
        run: |
          python3 - <<'PY'
          import io, json, re, requests, openpyxl

          url='https://attachment.news.eu.nasdaq.com/a448893223fb4755b7f9d92d18b128b24'
          r=requests.get(url,timeout=60,headers={'User-Agent':'BIAP Global Nordic identity probe'})
          r.raise_for_status()
          wb=openpyxl.load_workbook(io.BytesIO(r.content),read_only=True,data_only=True)

          needles=[
              'VOLV','VOLVO','H&M','HENNES','ERICSSON','NOKIA','KONE','NOVO NORDISK','CARLSBERG','MAERSK','MÆRSK','MAREL','ARION',
          ]
          isin_re=re.compile(r'\b(?:SE|FI|DK|IS)[A-Z0-9]{10}\b',re.I)
          hits=[]
          isin_hits=[]
          sheet_summaries={}
          for ws in wb.worksheets:
              nonempty=0
              text_cells=0
              local_hits=[]
              for ridx,row in enumerate(ws.iter_rows(values_only=True),start=1):
                  rowvals=[]
                  for cidx,value in enumerate(row,start=1):
                      if value in (None,''):
                          continue
                      nonempty += 1
                      text=str(value).strip()
                      if not text:
                          continue
                      text_cells += 1
                      upper=text.upper()
                      for needle in needles:
                          if needle in upper:
                              item={'sheet':ws.title,'row':ridx,'col':cidx,'needle':needle,'value':text[:240]}
                              hits.append(item); local_hits.append(item)
                              break
                      for match in isin_re.findall(text):
                          isin_hits.append({'sheet':ws.title,'row':ridx,'col':cidx,'isin':match.upper(),'value':text[:240]})
                      rowvals.append(text)
              sheet_summaries[ws.title]={'rows':ws.max_row,'cols':ws.max_column,'nonemptyCells':nonempty,'identityHits':len(local_hits)}

          print(json.dumps({
              'sheetSummaries':sheet_summaries,
              'knownIdentityHits':hits[:80],
              'knownIdentityHitCount':len(hits),
              'isinHits':isin_hits[:80],
              'isinHitCount':len(isin_hits),
          },indent=2,ensure_ascii=False))
          PY
