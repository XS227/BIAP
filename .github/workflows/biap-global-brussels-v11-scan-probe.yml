name: BIAP Global Brussels v11 scan probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-brussels-v11-scan-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe Brussels full-market scan
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://biap.dadashi.no/global-api/global'
          body=json.dumps({'country':'BE','exchange':'EURONEXT_BRUSSELS','topN':1,'discoveryLimit':5000,'deepLimit':1}).encode()
          req=urllib.request.Request(base+'/scan',data=body,method='POST',headers={
              'Content-Type':'application/json','Accept':'application/json','User-Agent':'BIAP-Brussels-v11-scan-probe'})
          with urllib.request.urlopen(req,timeout=300) as r:
              d=json.load(r)
          ready=d.get('dataReadiness') or {}
          out={
              'status':d.get('status'),'rankingEligible':d.get('rankingEligible'),
              'universeDiscovered':d.get('universeDiscovered'),'universeScreened':d.get('universeScreened'),
              'screeningCoveragePct':d.get('screeningCoveragePct'),'fundamentalCoveragePct':d.get('fundamentalCoveragePct'),
              'deepAnalyzed':d.get('deepAnalyzed'),'recommendationCount':d.get('recommendationCount'),
              'universeAuthoritative':ready.get('universeAuthoritative'),'universeSource':ready.get('universeSource'),
              'marketSource':ready.get('marketSource'),'reasons':ready.get('reasons'),'screeningErrors':d.get('screeningErrors')}
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['universeAuthoritative'] is True, out
          assert 'Euronext regulated official EOD' in str(out['marketSource']), out
          assert float(out['screeningCoveragePct'] or 0)>=90.0, out
          PY
