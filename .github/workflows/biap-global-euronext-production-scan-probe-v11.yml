name: BIAP Global Euronext production scan probe v11

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-euronext-production-scan-probe-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Probe full-market production scans after v11
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base='https://biap.dadashi.no/global-api/global'
          markets=[
              ('FR','EURONEXT_PARIS'),
              ('IT','EURONEXT_MILAN'),
              ('NL','EURONEXT_AMSTERDAM'),
              ('BE','EURONEXT_BRUSSELS'),
              ('PT','EURONEXT_LISBON'),
              ('NO','EURONEXT_OSLO'),
          ]
          def post(path, body, timeout=240):
              data=json.dumps(body).encode()
              req=urllib.request.Request(base+path,data=data,headers={
                  'Content-Type':'application/json','Accept':'application/json',
                  'User-Agent':'BIAP-Euronext-production-scan-probe-v11',
              },method='POST')
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)
          out={}
          for country,exchange in markets:
              key=f'{country}:{exchange}'
              d=post('/scan',{'country':country,'exchange':exchange,'topN':1,'discoveryLimit':5000,'deepLimit':3})
              ready=d.get('dataReadiness') or {}
              out[key]={
                  'status':d.get('status'),'rankingEligible':d.get('rankingEligible'),
                  'universeDiscovered':d.get('universeDiscovered'),'universeScreened':d.get('universeScreened'),
                  'screeningCoveragePct':d.get('screeningCoveragePct'),'fundamentalCoveragePct':d.get('fundamentalCoveragePct'),
                  'deepAnalyzed':d.get('deepAnalyzed'),'recommendationCount':d.get('recommendationCount'),
                  'universeAuthoritative':ready.get('universeAuthoritative'),'universeSource':ready.get('universeSource'),
                  'marketSource':ready.get('marketSource'),'reasons':ready.get('reasons'),
              }
          print(json.dumps(out,indent=2,sort_keys=True))
          for key,row in out.items():
              assert row['universeAuthoritative'] is True, (key,row)
              assert 'official-esma-firds-universe' in str(row['universeSource']), (key,row)
              assert 'Euronext regulated official EOD' in str(row['marketSource']), (key,row)
              assert float(row['screeningCoveragePct'] or 0)>=90.0, (key,row)
          PY
