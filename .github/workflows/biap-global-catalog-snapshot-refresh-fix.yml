name: BIAP Global catalog snapshot refresh fix

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-catalog-snapshot-refresh-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply metadata fix
        run: python tools/apply_catalog_snapshot_refresh_fix.py
      - name: Install backend dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Compile and test Global backend
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Commit metadata fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_routes.py analysis/tests/test_global_catalog_snapshot_refresh.py
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh catalog metadata after authoritative universe load'
          git push origin HEAD:feat/biap-global
