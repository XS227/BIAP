name: BIAP Global official evidence live check

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-official-live-check.yml'

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Global runtime
        working-directory: analysis
        run: python -m pip install -r requirements.txt
      - name: Inspect KAP live HTML
        working-directory: analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from global_markets.kap import KAPFundamentalsProvider, KAP_BASE
          provider = KAPFundamentalsProvider()
          directory = provider._load_directory()
          print('KAP_DIRECTORY_COUNT', len(directory), 'AKBNK_PATH', directory.get('AKBNK'))
          path = directory.get('AKBNK')
          assert path
          slug = path.split('/sirket-bilgileri/ozet/', 1)[-1].strip('/')
          url = f'{KAP_BASE}/tr/sirket-finansal-bilgileri/{slug}'
          html = provider._get(url)
          print('KAP_HTML_LEN', len(html), 'TABLE_COUNT', html.lower().count('<table'), 'TR_COUNT', html.lower().count('<tr'))
          for needle in ('2025/12', '2025', 'Varlıklar Toplamı', 'VARLIKLAR TOPLAMI', 'Net Dönem', 'NET DÖNEM'):
              idx = html.find(needle)
              print('KAP_NEEDLE', repr(needle), idx)
              if idx >= 0:
                  print('KAP_SNIPPET', html[max(0, idx-500):idx+1200].replace('\n', ' ')[:1700])
          PY
