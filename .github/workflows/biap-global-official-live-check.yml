name: BIAP Global official evidence live check

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-official-live-check.yml'

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production official evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          base = 'https://biap.dadashi.no/global-api/global'
          cases = [
              ('US', 'NASDAQ', 'AAPL', 'USD', 'sec-edgar-xbrl-cached'),
              ('FR', 'EURONEXT_PARIS', 'MC', 'EUR', 'esef-xbrl-cached'),
              ('ES', 'BME_MADRID', 'SAN', 'EUR', 'esef-xbrl-cached'),
              ('TR', 'BIST', 'AKBNK', 'TRY', 'kap-official-financial-summary'),
              ('BR', 'B3', 'PETR4', 'BRL', 'cvm-open-data-dfp-resolved'),
              ('DE', 'XETRA', 'SIE', 'EUR', 'de-official-issuer-financials'),
              ('DE', 'XETRA', 'ALV', 'EUR', 'de-official-issuer-financials'),
              ('SG', 'SGX', 'S68', 'SGD', 'sgx-official-issuer-financial-information'),
              ('HK', 'HKEX', '0388', 'HKD', 'hkex-official-issuer-financial-statements'),
          ]
          for country, exchange, ticker, currency, expected_provider in cases:
              q = urllib.parse.urlencode({'q': ticker, 'limit': 20})
              with urllib.request.urlopen(f'{base}/instruments/{country}/{exchange}?{q}', timeout=45) as r:
                  catalog = json.load(r)
              exact = next((row for row in (catalog.get('instruments') or []) if str(row.get('ticker') or '').upper() == ticker), None)
              assert exact, (country, exchange, ticker, catalog)
              body = {
                  'country': country, 'exchange': exchange,
                  'ticker': exact.get('ticker') or ticker,
                  'name': exact.get('name') or ticker,
                  'currency': exact.get('currency') or currency,
                  'isin': exact.get('isin'), 'lei': exact.get('lei'),
              }
              req = urllib.request.Request(
                  f'{base}/analyze', data=json.dumps(body).encode(),
                  headers={'Content-Type':'application/json','Accept':'application/json'}, method='POST'
              )
              with urllib.request.urlopen(req, timeout=90) as r:
                  payload = json.load(r)
              company = payload.get('company') or {}
              evidence = payload.get('evidence') or {}
              sources = company.get('sources') or []
              providers = {str(s.get('provider') or '') for s in sources}
              result = {
                  'market': f'{country}/{exchange}', 'ticker': ticker,
                  'catalogName': exact.get('name'), 'providers': sorted(providers),
                  'evidence': evidence.get('status'), 'missing': evidence.get('missing_critical'),
                  'coverage': evidence.get('coverage'),
                  'filingPeriod': company.get('filing_period_end'),
                  'fundamentalsCache': (company.get('raw_provider_fields') or {}).get('fundamentals_cache'),
                  'kapTransport': (company.get('raw_provider_fields') or {}).get('kap_transport'),
                  'cvmMatchMode': (company.get('raw_provider_fields') or {}).get('cvm_match_mode'),
              }
              print(json.dumps(result, ensure_ascii=False, sort_keys=True))
              assert expected_provider in providers, result
              assert 'fundamental_source' not in (evidence.get('missing_critical') or []), result
              assert evidence.get('status') in {'PASS','WARN'}, result
          PY
