name: BIAP Global ADX production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-adx-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify official ADX market and annual filing evidence on production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          ticker='ALDAR'
          r=s.get(base+'/instruments/AE/ADX',params={'q':ticker,'limit':5},timeout=75)
          print('SEARCH',r.status_code,r.text[:8000])
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
          assert exact, rows
          row=exact[0]
          payload={'country':'AE','exchange':'ADX','ticker':ticker,'name':row.get('name'),
                   'currency':row.get('currency') or 'AED','isin':row.get('isin'),'lei':row.get('lei')}
          a=s.post(base+'/analyze',json=payload,timeout=150)
          print('ANALYZE',a.status_code,a.text[:30000])
          a.raise_for_status()
          data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
          assert any(x.get('provider')=='official-adx-company-market' for x in sources), sources
          assert any(x.get('provider')=='official-adx-financial-report-v2' for x in sources), sources
          assert any(x.get('source_type')=='official_exchange_financial_statement' for x in sources), sources
          assert company.get('price') is not None and company.get('price') > 0, company
          assert company.get('market_cap') is not None, company
          assert company.get('price_52w_high') is not None, company
          assert company.get('price_52w_low') is not None, company
          assert company.get('revenue') is not None and company.get('revenue') > 0, company
          assert company.get('net_income') is not None, company
          assert company.get('total_equity') is not None, company
          assert company.get('cash_and_equivalents') is not None, company
          assert company.get('filing_period_end') == '2025-12-31', company
          evidence=data.get('evidence') or {}
          missing=evidence.get('missing_critical') or []
          assert 'verified_price' not in missing, evidence
          assert 'market_source' not in missing, evidence
          assert 'fundamental_source' not in missing, evidence
          assert evidence.get('status') == 'PASS', evidence
          print('OK ALDAR official ADX market + annual filing connected',
                company.get('price'),company.get('market_cap'),company.get('revenue'),
                company.get('net_income'),company.get('total_equity'),
                company.get('cash_and_equivalents'),company.get('filing_period_end'),
                evidence.get('status'),missing)
          PY
