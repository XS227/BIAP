name: BIAP Global Germany Börse Frankfurt fundamentals audit

on:
  workflow_dispatch:
  push:
    branches: [feat/biap-global]
    paths:
      - 'analysis/global_markets/boerse_frankfurt_fundamentals.py'
      - 'tools/audit_de_boerse_frankfurt.py'
      - '.github/workflows/biap-global-de-boerse-frankfurt-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Audit full live Germany universe against official exchange key data
        run: python ../tools/audit_de_boerse_frankfurt.py --workers 6
