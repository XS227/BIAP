name: BIAP Global Euronext directory form probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-euronext-directory-form-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests beautifulsoup4
      - name: Inspect regulated directory form and data hooks
        run: python tools/probe_euronext_directory_form.py
