name: BIAP Global FIRDS vendor join probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-firds-vendor-join-probe.yml'
      - 'tools/probe_firds_vendor_join.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - name: Install dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Probe FIRDS authoritative identity joined to ticker catalog
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: python ../tools/probe_firds_vendor_join.py
