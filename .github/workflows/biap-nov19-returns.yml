name: BIAP - complete Nov 19 market close research

# Research-only isolated branch. Temporary push validates one run; final workflow
# retains workflow_dispatch only. No deploy, server access or snapshot mutation.
on:
  push:
    branches: [research/paper-portfolio-diagnostics-20261119]
    paths:
      - '.github/workflows/biap-nov19-returns.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-market-closes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original frozen dataset checksum
        run: |
          set -euo pipefail
          (cd research && sha256sum -c paper_portfolio_2026-10-20.json.sha256)
      - name: Offline diagnostics tests
        run: |
          python3 -m unittest discover -s research/tests -p test_paper_portfolio_diagnostics.py -v
      - name: Compute returns against 2026-11-19 last close
        env:
          OUT: ${{ runner.temp }}/biap-nov19
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 research/paper_portfolio_returns.py \
             research/paper_portfolio_2026-10-20.json \
             --end 2026-11-19 --json "$OUT/returns_2026-11-19.json" \
             | tee "$OUT/returns_log.txt"
      - name: Compute median, trimmed and volatility diagnostics
        env:
          OUT: ${{ runner.temp }}/biap-nov19
        run: |
          set -euo pipefail
          python3 research/paper_portfolio_diagnostics.py \
             --snapshot research/paper_portfolio_2026-10-20.json \
             --end 2026-11-19 --metadata-mode none \
             --out-dir "$OUT/diagnostics" \
             | tee "$OUT/diagnostic_log.txt"
      - name: Export country/market tables and benchmark-price completeness
        env:
          OUT: ${{ runner.temp }}/biap-nov19
        run: |
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path
          p=Path(os.environ["OUT"])
          r=json.loads((p/"returns_2026-11-19.json").read_text())
          m=r["B_returns_priced_subset"]["markets"]
          rows=[]
          def pct(x): return None if x is None else round(x*100,5)
          for key,v in m.items():
              buy,sell=v["BUY"],v["SELL"]
              dates=[v.get("benchmarkExitDate")]
              complete=v.get("benchmarkReturn") is not None and v.get("benchmarkExitDate")=="2026-11-19"
              rows.append({
                "market":key,"buy_n":buy["withData"],"sell_n":sell["withData"],
                "buy_return_pct":pct(buy["equalWeightReturn"]),"sell_return_pct":pct(sell["equalWeightReturn"]),
                "buy_minus_sell_pp":pct(v["BUY_minus_SELL"]),
                "benchmark":v["benchmark"],"benchmark_return_pct":pct(v["benchmarkReturn"]),
                "benchmark_exit_date":v.get("benchmarkExitDate"),"benchmark_is_19nov":complete,
                "buy_excess_pp":pct(buy["excessVsBenchmark"]),
                "sell_excess_pp":pct(sell["excessVsBenchmark"]),
                "buy_hit_rate_pct":pct(buy["hitRateVsBenchmark"]),
                "sell_hit_rate_pct":pct(sell["hitRateVsBenchmark"])
              })
          hdr=list(rows[0])
          with (p/"markets_19nov.csv").open("w",newline="",encoding="utf-8-sig") as fh:
              w=csv.DictWriter(fh,fieldnames=hdr);w.writeheader();w.writerows(rows)
          # Equal weight across 12 trading markets; do not conflate with country/stock weighting.
          pooled=r["B_returns_priced_subset"]["ALL_exchange_equal_weighted"]
          with (p/"equal_market_pooled.json").open("w") as fh:
              json.dump({k:pct(v) for k,v in pooled.items()},fh,indent=2)
          country={}
          for row in rows:
              country.setdefault(row["market"].split(":")[0],[]).append(row)
          def avg(vals):
              vals=[v for v in vals if v is not None]
              return round(sum(vals)/len(vals),5) if vals else None
          country_rows=[]
          for k,g in country.items():
              country_rows.append({"country":k,"venues":len(g),"buy_pct":avg([x["buy_return_pct"] for x in g]),
              "sell_pct":avg([x["sell_return_pct"] for x in g]),"spread_pp":avg([x["buy_minus_sell_pp"] for x in g]),
              "benchmark_pct":avg([x["benchmark_return_pct"] for x in g]),
              "benchmarks_all_final_19nov":all(x["benchmark_is_19nov"] for x in g)})
          with (p/"countries_19nov.csv").open("w",newline="",encoding="utf-8-sig") as fh:
              w=csv.DictWriter(fh,fieldnames=list(country_rows[0]));w.writeheader();w.writerows(country_rows)
          bad=r["C_unpriced"]
          with (p/"excluded_unpriced.csv").open("w",newline="",encoding="utf-8-sig") as fh:
              w=csv.DictWriter(fh,fieldnames=["market","side","ticker","category","reason"],extrasaction="ignore")
              w.writeheader();w.writerows(bad)
          needs=[x for x in rows if not x["benchmark_is_19nov"]]
          print("\n=== RESULT 2026-11-19 (pct, pp) ===")
          print("MARKET                     BUY       SELL      SPREAD     BENCH     BENCH_DATE  HIT BUY")
          for x in rows:
              print(f"{x['market']:<26}{x['buy_return_pct']:>+8.2f} {x['sell_return_pct']:>+8.2f} {x['buy_minus_sell_pp']:>+8.2f} "
                    f"{str(x['benchmark_return_pct']):>7}  {str(x['benchmark_exit_date']):>12} {str(x['buy_hit_rate_pct']):>7}")
          print("POOLED 12 VENUES",pooled)
          print("MISSING or STALE BENCHMARK 19-NOV closes:",needs)
          print("UNPRICED HOLDINGS:",len(bad))
          (p/"README.md").write_text(
            "# BIAP one-month paper portfolio through 2026-11-19\n\n"
            "Read-only frozen cohort: 2026-10-20. Actual 2026-11-19 closes only when vendor returned that date.\n"
            "BUY/SELL total returns (dividends included) benchmarked to vendor price indices.\n"
            "Daily historical prices can be restated; see later and price quality flags.\n"
            "Not the separate 2026-10-19 A-E portfolio. Never merge those cohorts.\n"
            "The table flags any benchmark whose final 19-Nov close is absent.\n"
            "Diagnostics market-cap and sector fields intentionally UNKNOWN in this run.\n"
            "Results not approved for manuscript until date/price checks complete.\n",encoding="utf-8")
          PY
      - name: Upload private research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biap-nov19-frozen-cohort-${{ github.run_id }}
          path: ${{ runner.temp }}/biap-nov19/
          retention-days: 30
          if-no-files-found: warn
