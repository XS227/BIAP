name: BIAP Global Euronext regulated probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-euronext-regulated-probe.yml'
      - 'tools/probe_euronext_regulated.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests
      - run: python tools/probe_euronext_regulated.py
