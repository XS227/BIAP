name: BIAP Global NZX fundamentals probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-nzx-fundamentals-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4 pypdf
      - name: Probe official NZX annual result announcement structure
        shell: bash
        run: |
          python - <<'PY'
          import re,requests,urllib.parse,json
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'en-NZ,en;q=0.9'}
          for ticker in ('NZX','SUM','SCL'):
              page='https://new.nzx.com/companies/'+ticker+'/announcements'
              cr=requests.get(page,headers=H,timeout=45)
              print('\n### COMPANY',ticker,'STATUS',cr.status_code,'BYTES',len(cr.content))
              if cr.ok:
                  rx=re.findall(r"<a[^>]+href=[\"']([^\"']*/announcements/\\d+)[\"'][^>]*>(.*?)</a>",cr.text,re.I|re.S)
                  print('PROVIDER_REGEX',ticker,'COUNT',len(rx))
                  for href,label_html in rx[:80]:
                      label=re.sub(r'<[^>]+>',' ',label_html)
                      label=' '.join(label.split())
                      if any(k in label.lower() for k in ('annual report','full year','financial results','annual results')):
                          print('PROVIDER_MATCH',ticker,repr(label[:220]),href)
                          if ticker == 'NZX' and 'annual report' in label.lower():
                              au=urllib.parse.urljoin(cr.url,href)
                              ar=requests.get(au,headers=H,timeout=45)
                              print('NEXT_DEBUG_URL',au,'STATUS',ar.status_code,'BYTES',len(ar.content))
                              nm=re.search(r'<script[^>]+id=["\\']__NEXT_DATA__["\\'][^>]*>(.*?)</script>',ar.text,re.I|re.S)
                              print('NEXT_DEBUG_MATCH',bool(nm),'SNIP',repr((nm.group(1)[:1000] if nm else ar.text[:1000])))
                  cs=BeautifulSoup(cr.text,'html.parser')
                  for a in cs.find_all('a',href=True):
                      href=urllib.parse.urljoin(cr.url,a['href'])
                      txt=' '.join(a.stripped_strings)
                      if '/announcements/' in href and any(k in txt.lower() for k in ('annual','full year','financial results','results')):
                          print('COMPANY_LINK',ticker,txt[:180],href)

          for ident in ('468191','468297','468113'):
              url='https://www.nzx.com/announcements/'+ident
              r=requests.get(url,headers=H,timeout=45)
              print('\n### ANN',ident,'STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'))
              print(r.text[:900].replace('\n',' '))
              if not r.ok: continue
              soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                  href=urllib.parse.urljoin(r.url,a['href'])
                  txt=' '.join(a.stripped_strings)
                  low=(href+' '+txt).lower()
                  if any(k in low for k in ('annual','financial','result','attachment','download','pdf','document')):
                      print('LINK',ident,txt[:180],href)
              for s in soup.find_all('script'):
                  body=s.string or s.get_text(' ',strip=True)
                  if not body: continue
                  if any(k in body.lower() for k in ('attachment','announcement','document','download')):
                      print('SCRIPT_CTX',ident,body[:12000])
              for m in re.finditer(r'https?://[^"\'<> ]+',r.text):
                  u=m.group(0).replace('&amp;','&')
                  if any(k in u.lower() for k in ('attachment','download','document','announc','pdf')):
                      print('URL',ident,u[:800])
          # Extract two official short-form results PDFs to establish conservative table labels.
          import io
          from pypdf import PdfReader
          for name,url in [
              ('NZX_RESULTS','https://api.nzx.com/public/announcement/468191/attachment/463240/468191-463240.pdf'),
              ('SUM_RESULTS','https://api.nzx.com/public/announcement/468297/attachment/463398/468297-463398.pdf'),
              ('SCL_RESULTS','https://api.nzx.com/public/announcement/468113/attachment/463126/468113-463126.pdf'),
          ]:
              rr=requests.get(url,headers=H,timeout=60)
              print('\n### PDF',name,'STATUS',rr.status_code,'BYTES',len(rr.content),rr.headers.get('content-type'))
              rr.raise_for_status()
              reader=PdfReader(io.BytesIO(rr.content))
              text='\n'.join((p.extract_text() or '') for p in reader.pages[:20])
              print('PDF_TEXT',name,text[:25000])
          # Inspect NZX Limited audited annual report around primary statements.
          rr=requests.get('https://api.nzx.com/public/announcement/468191/attachment/463239/468191-463239.pdf',headers=H,timeout=90)
          rr.raise_for_status()
          reader=PdfReader(io.BytesIO(rr.content))
          full='\n'.join((p.extract_text() or '') for p in reader.pages)
          print('NZX_ANNUAL_PAGES',len(reader.pages),'TEXT',len(full))
          for needle in ('statement of comprehensive income','statement of financial position','statement of cash flows',
                         'total assets','total liabilities','total equity','cash and cash equivalents','operating activities'):
              low=full.lower()
              start=0
              count=0
              while count<6:
                  pos=low.find(needle,start)
                  if pos<0: break
                  print('ANNUAL_CTX',needle,repr(full[max(0,pos-900):pos+2500]))
                  start=pos+len(needle); count+=1
          PY
