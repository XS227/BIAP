name: BIAP Global Saudi Tadawul report fast

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-saudi-tadawul-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - run: |
          python - <<'PY'
          import requests
          for url in (
            'https://r.jina.ai/http://www.tadawulgroup.sa/Resources/Reports-v2/DetailedDaily_en.html',
            'https://r.jina.ai/http://www.tadawulgroup.sa/Resources/Reports-v2/DetailedDailySme_en.html',
          ):
              try:
                  r=requests.get(url,headers={'User-Agent':'BIAP-Global/1.0','Accept':'text/plain,*/*'},timeout=12)
                  print('TADREPORT',url,r.status_code,len(r.content),r.text[:1200].replace('\n',' '))
              except Exception as e:
                  print('TADREPORT',url,'ERROR',type(e).__name__,e)
          PY
