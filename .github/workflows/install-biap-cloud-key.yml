name: Install BIAP cloud SSH key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-biap-cloud-key.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-key:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '5.249.252.88' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
      VPS_IPV6: '2a02:2350:a:107::164'
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      NEW_PUBKEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEb9dXFmv3IoJoWLdNoBuXeysjbeoq/jpP/3pG3M5mp2 biap-cloud'

    steps:
      - name: Validate deploy key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          echo "Target: $VPS_USER@$VPS_HOST:${VPS_PORT:-22}"

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_deploy_key
          chmod 600 ~/.ssh/biap_deploy_key

      - name: Install and verify cloud public key
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          for TARGET_HOST in "$VPS_IPV6" "$VPS_HOST"; do
            for attempt in 1 2 3; do
              echo "SSH target $TARGET_HOST attempt $attempt/3"
              if ssh -i ~/.ssh/biap_deploy_key -p "$PORT" \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=10 \
                "$VPS_USER@$TARGET_HOST" \
                "NEW_PUBKEY='$NEW_PUBKEY' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          if grep -qxF "$NEW_PUBKEY" "$HOME/.ssh/authorized_keys"; then
            echo "BIAP cloud key already present"
          else
            printf '%s\n' "$NEW_PUBKEY" >> "$HOME/.ssh/authorized_keys"
            echo "BIAP cloud key installed"
          fi
          grep -qxF "$NEW_PUBKEY" "$HOME/.ssh/authorized_keys"
          echo "AUTHORIZED_KEY_OK"
          REMOTE
              then
                echo "Cloud SSH key installation verified via $TARGET_HOST"
                exit 0
              fi
              sleep 5
            done
          done
          echo "Unable to reach VPS over IPv6 or IPv4" >&2
          exit 1
