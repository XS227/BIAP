name: BIAP Global Swiss SEC production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-swiss-sec-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify current Swiss SEC IFRS evidence in production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          expected={'NOVN':'NVS','ALC':None}
          for ticker,alias in expected.items():
              r=s.get(base+'/instruments/CH/SIX',params={'q':ticker,'limit':5},timeout=90)
              print('SEARCH',ticker,r.status_code,r.text[:10000])
              r.raise_for_status()
              rows=r.json().get('instruments') or []
              exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
              assert exact, rows
              row=exact[0]
              if alias is not None:
                  assert (row.get('raw_provider_fields') or {}).get('sec_ticker_alias') == alias, row
              payload={'country':'CH','exchange':'SIX','ticker':ticker,'name':row.get('name'),
                       'currency':row.get('currency') or 'CHF','isin':row.get('isin'),'lei':row.get('lei')}
              a=s.post(base+'/analyze',json=payload,timeout=180)
              print('ANALYZE',ticker,a.status_code,a.text[:35000])
              a.raise_for_status()
              data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
              assert any(x.get('provider')=='sec-edgar-foreign-ifrs-cached' for x in sources), sources
              assert any(x.get('source_type')=='official_regulatory_xbrl' for x in sources), sources
              assert company.get('net_income') is not None, company
              assert company.get('total_assets') is not None, company
              assert company.get('total_liabilities') is not None, company
              assert company.get('total_equity') is not None, company
              assert company.get('filing_period_end') and company.get('filing_period_end') >= '2025-01-01', company
              evidence=data.get('evidence') or {}
              missing=evidence.get('missing_critical') or []
              assert 'fundamental_source' not in missing, evidence
              assert evidence.get('status') in {'PASS','WARN'}, evidence
              print('OK',ticker,'SEC IFRS connected',company.get('net_income'),company.get('total_assets'),
                    company.get('total_liabilities'),company.get('total_equity'),
                    company.get('operating_cash_flow'),company.get('filing_period_end'),
                    evidence.get('status'),missing)

          # UBS's standard SEC CompanyFacts currently expose only an old annual
          # period for the fields BIAP requires. Production must fail closed
          # rather than promote 2021 fundamentals to current official evidence.
          ticker='UBSG'
          r=s.get(base+'/instruments/CH/SIX',params={'q':ticker,'limit':5},timeout=90)
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
          assert exact, rows
          row=exact[0]
          payload={'country':'CH','exchange':'SIX','ticker':ticker,'name':row.get('name'),
                   'currency':row.get('currency') or 'CHF','isin':row.get('isin'),'lei':row.get('lei')}
          a=s.post(base+'/analyze',json=payload,timeout=180)
          print('STALE_GUARD UBSG',a.status_code,a.text[:30000])
          a.raise_for_status()
          data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
          assert not any(x.get('provider')=='sec-edgar-foreign-ifrs-cached' for x in sources), sources
          evidence=data.get('evidence') or {}
          missing=evidence.get('missing_critical') or []
          assert 'fundamental_source' in missing, evidence
          assert evidence.get('status') == 'BLOCK', evidence
          err=str((company.get('raw_provider_fields') or {}).get('fundamentals_primary_error') or '')
          assert 'stale' in err.lower(), err
          print('OK UBSG stale SEC annual data blocked',missing,err)
          PY
