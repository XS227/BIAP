name: BIAP Global Swiss SEC production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-swiss-sec-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify Novartis official SEC IFRS evidence in production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          ticker='NOVN'
          r=s.get(base+'/instruments/CH/SIX',params={'q':ticker,'limit':5},timeout=90)
          print('SEARCH',r.status_code,r.text[:10000])
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
          assert exact, rows
          row=exact[0]
          assert (row.get('raw_provider_fields') or {}).get('sec_ticker_alias') == 'NVS', row
          payload={'country':'CH','exchange':'SIX','ticker':ticker,'name':row.get('name'),
                   'currency':row.get('currency') or 'CHF','isin':row.get('isin'),'lei':row.get('lei'),
                   'raw_provider_fields':row.get('raw_provider_fields') or {}}
          a=s.post(base+'/analyze',json=payload,timeout=180)
          print('ANALYZE',a.status_code,a.text[:35000])
          a.raise_for_status()
          data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
          assert any(x.get('provider')=='sec-edgar-foreign-ifrs-cached' for x in sources), sources
          assert any(x.get('source_type')=='official_regulatory_xbrl' for x in sources), sources
          assert company.get('revenue') is not None and company.get('revenue') > 0, company
          assert company.get('net_income') is not None, company
          assert company.get('total_assets') is not None, company
          evidence=data.get('evidence') or {}
          missing=evidence.get('missing_critical') or []
          assert 'fundamental_source' not in missing, evidence
          print('OK NOVN SEC IFRS connected',company.get('revenue'),company.get('net_income'),
                company.get('total_assets'),company.get('filing_period_end'),evidence.get('status'),missing)
          PY
