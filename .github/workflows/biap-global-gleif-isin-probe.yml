name: BIAP Global GLEIF ISIN resolver probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-gleif-isin-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official GLEIF ISIN filters
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          samples = {
            "HM.B":"SE0000106270",
            "INVE.B":"SE0015811963",
            "SAAB.B":"SE0021921269",
            "ATCO.A":"SE0017486889",
            "DSV":"DK0060079531",
            "MAERSK.B":"DK0010244508",
            "RYA":"IE00BYTBXV33",
          }
          base="https://api.gleif.org/api/v1/lei-records"
          for ticker,isin in samples.items():
              url=base+"?"+urllib.parse.urlencode({"filter[isin]":isin,"page[size]":"10"})
              req=urllib.request.Request(url,headers={"Accept":"application/vnd.api+json","User-Agent":"BIAP-Global/1.0 ISIN-probe"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=json.load(r)
                  rows=payload.get("data") or []
                  out=[]
                  for row in rows:
                      attrs=row.get("attributes") or {}
                      ent=attrs.get("entity") or {}
                      name=(ent.get("legalName") or {}).get("name")
                      out.append({"lei":row.get("id"),"name":name,"status":ent.get("status")})
                  print(json.dumps({"ticker":ticker,"isin":isin,"count":len(rows),"matches":out},ensure_ascii=False))
              except Exception as exc:
                  print(json.dumps({"ticker":ticker,"isin":isin,"error":f"{type(exc).__name__}: {exc}"},ensure_ascii=False))
          PY
