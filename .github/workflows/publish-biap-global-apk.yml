# Auto-publish successful BIAP Global APK builds: 2026-09-22
# Publish final RC APK: 2026-09-20
# Republish BIAP Global 0.3.8 after successful universal build: 2026-09-22
name: Publish BIAP Global APK

# Publishes the latest successful BIAP Global ARM64 build to the public web download path.
on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/publish-biap-global-apk.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["BIAP Global APK"]
    types: [completed]
    branches: [feat/biap-global]

concurrency:
  group: publish-biap-global-apk
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '5.249.252.88' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check deploy credentials
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured" >&2; exit 1; }

      - name: Download latest successful BIAP Global APK artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'biap-global-apk-publisher',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          runs = get_json(base + '/actions/workflows/biap-global-apk.yml/runs?branch=feat%2Fbiap-global&status=success&per_page=10')
          chosen = None
          for run in runs.get('workflow_runs', []):
              artifacts = get_json(base + f"/actions/runs/{run['id']}/artifacts?per_page=100")
              for artifact in artifacts.get('artifacts', []):
                  if not artifact.get('expired') and (
                    artifact.get('name', '').startswith('biap-global-android-universal-')
                    or artifact.get('name', '').startswith('biap-global-android-arm64-')
                ):
                      chosen = artifact
                      break
              if chosen:
                  break
          if not chosen:
              raise SystemExit('No non-expired successful BIAP Global ARM64 APK artifact found')

          print(chosen['id'])
          with open('/tmp/biap-global-artifact-id', 'w', encoding='utf-8') as fh:
              fh.write(str(chosen['id']))
          PY

          ARTIFACT_ID="$(cat /tmp/biap-global-artifact-id)"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/biap-global-apk.zip
          mkdir -p /tmp/biap-global-apk
          unzip -q /tmp/biap-global-apk.zip -d /tmp/biap-global-apk
          APK="$(find /tmp/biap-global-apk -maxdepth 2 -type f \( -name 'BIAP-Global-*-universal.apk' -o -name 'BIAP-Global-*-arm64.apk' \) | head -n 1)"
          test -n "$APK" -a -f "$APK"
          cp "$APK" /tmp/BIAP-Global-latest.apk
          cp "$APK" /tmp/BIAP-Global-latest-arm64.apk
          sha256sum /tmp/BIAP-Global-latest.apk | awk '{print $1}' > /tmp/BIAP-Global-latest.apk.sha256
          cp /tmp/BIAP-Global-latest.apk.sha256 /tmp/BIAP-Global-latest-arm64.apk.sha256
          printf '%s\n' "$(basename "$APK")" > /tmp/BIAP-Global-latest-arm64.name
          ls -lh /tmp/BIAP-Global-latest-arm64.apk

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_global_key
          chmod 600 ~/.ssh/biap_global_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Publish APK to BIAP Global website
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -i ~/.ssh/biap_global_key -P "$PORT" -o BatchMode=yes \
            /tmp/BIAP-Global-latest.apk \
            /tmp/BIAP-Global-latest.apk.sha256 \
            /tmp/BIAP-Global-latest-arm64.apk \
            /tmp/BIAP-Global-latest-arm64.apk.sha256 \
            /tmp/BIAP-Global-latest-arm64.name \
            "$VPS_USER@$VPS_HOST:/tmp/"
          ssh -i ~/.ssh/biap_global_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          WEB_ROOT=/var/www/biap-global-web
          DOWNLOAD_DIR="$WEB_ROOT/download"
          $SUDO install -d -m 0755 "$DOWNLOAD_DIR"
          VERSIONED_NAME="$(cat /tmp/BIAP-Global-latest-arm64.name)"
          test -n "$VERSIONED_NAME"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest.apk "$DOWNLOAD_DIR/BIAP-Global-latest.apk"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest.apk.sha256 "$DOWNLOAD_DIR/BIAP-Global-latest.apk.sha256"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest.apk "$DOWNLOAD_DIR/$VERSIONED_NAME"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest.apk.sha256 "$DOWNLOAD_DIR/$VERSIONED_NAME.sha256"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest-arm64.apk "$DOWNLOAD_DIR/BIAP-Global-latest-arm64.apk"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest-arm64.apk.sha256 "$DOWNLOAD_DIR/BIAP-Global-latest-arm64.apk.sha256"
          $SUDO install -m 0644 /tmp/BIAP-Global-latest-arm64.name "$DOWNLOAD_DIR/BIAP-Global-latest-arm64.name"
          rm -f /tmp/BIAP-Global-latest.apk /tmp/BIAP-Global-latest.apk.sha256 /tmp/BIAP-Global-latest-arm64.apk /tmp/BIAP-Global-latest-arm64.apk.sha256 /tmp/BIAP-Global-latest-arm64.name
          ls -lh "$DOWNLOAD_DIR/BIAP-Global-latest.apk"
          REMOTE

      - name: Verify public APK download
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            --range 0-1023 https://biap.dadashi.no/global/download/BIAP-Global-latest.apk \
            -o /tmp/apk-head.bin
          test "$(wc -c < /tmp/apk-head.bin)" -gt 100
          HASH="$(curl --fail --silent --show-error --max-time 15 \
            https://biap.dadashi.no/global/download/BIAP-Global-latest.apk.sha256)"
          printf '%s\n' "$HASH" | grep -Eiq '^[0-9a-f]{64}$'
          HEADERS="$(curl --fail --silent --show-error --head --max-time 15 \
            https://biap.dadashi.no/global/download/BIAP-Global-0.3.9-universal.apk)"
          printf '%s\n' "$HEADERS"
          printf '%s\n' "$HEADERS" | grep -Eiq '^content-type: application/vnd\.android\.package-archive'
          printf '%s\n' "$HEADERS" | grep -Eiq '^content-disposition: attachment; filename=BIAP-Global-0\.3\.9-universal\.apk'
          printf '%s\n' "$HEADERS" | grep -Eiq '^accept-ranges: bytes'
          echo 'BIAP Global APK download is public, versioned, and Android attachment headers are valid.'
