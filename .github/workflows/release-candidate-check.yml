name: Release candidate check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'analysis/**'
      - 'mobile/**'
      - 'deploy/**'
      - '.github/workflows/release-candidate-check.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests with diagnostics
        run: timeout --signal=TERM 12m pytest -vv --durations=25

  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir dist-android

  android-installable-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Upload installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-android-qa-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
