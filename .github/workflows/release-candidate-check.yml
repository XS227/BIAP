name: Release candidate check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'analysis/**'
      - 'mobile/**'
      - 'deploy/**'
      - '.github/workflows/release-candidate-check.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests with diagnostics
        run: timeout --signal=TERM 12m pytest -vv --durations=25

  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir dist-android

  android-installable-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Require Expo authentication for the signing key
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured. A signed upgrade APK must be built by EAS with the project's existing Android signing credential."
            exit 1
          fi
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Build signed Android APK with the existing EAS credential
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
      - name: Download the signed APK
        run: |
          node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('EAS did not return an Android APK URL');
          fs.writeFileSync('eas-apk-url.txt', url);
          NODE
          VERSION=$(node -p "require('./app.json').expo.version")
          curl --fail --location --retry 3 --retry-delay 3 "$(cat eas-apk-url.txt)" -o "BIAP-${VERSION}.apk"
          test -s "BIAP-${VERSION}.apk"
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found on the runner"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs BIAP-*.apk
      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-android-signed-${{ github.sha }}
          path: mobile/BIAP-*.apk
          if-no-files-found: error
          retention-days: 14
