name: Release candidate check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'analysis/**'
      - 'mobile/**'
      - 'deploy/**'
      - '.github/workflows/release-candidate-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests with diagnostics
        run: timeout --signal=TERM 12m pytest -vv --durations=25

  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir dist-android

  android-installable-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Upload installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-android-qa-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-mobile-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, android-installable-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download successful Android APK
        uses: actions/download-artifact@v4
        with:
          pattern: biap-android-qa-*
          path: /tmp/biap-apk
          merge-multiple: true
      - name: Prepare stable release asset and notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import json
          with open('mobile/app.json', encoding='utf-8') as fh:
              print(json.load(fh)['expo']['version'])
          PY
          )"
          TAG="mobile-v${VERSION}"
          APK="$(find /tmp/biap-apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK"
          cp "$APK" /tmp/biap-latest.apk
          python3 - <<'PY' > /tmp/biap-release-notes.md
          import json
          with open('analysis/mobile_release.json', encoding='utf-8') as fh:
              release = json.load(fh)
          print(f"BIAP Mobile v{release['version']}\n")
          for item in release.get('changes') or []:
              print(f"- {item}")
          print("\nAPK: biap-latest.apk")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish stable APK on GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/biap-latest.apk --clobber
            gh release edit "$TAG" --title "BIAP Mobile v${VERSION}" --notes-file /tmp/biap-release-notes.md
          else
            gh release create "$TAG" /tmp/biap-latest.apk \
              --target "$GITHUB_SHA" \
              --title "BIAP Mobile v${VERSION}" \
              --notes-file /tmp/biap-release-notes.md \
              --latest
          fi
      - name: Release summary
        run: |
          echo "### BIAP Mobile ${{ steps.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable APK published as **biap-latest.apk** on GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "In-app updater can use the stable latest-release download URL." >> "$GITHUB_STEP_SUMMARY"
