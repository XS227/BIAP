name: Release candidate check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'analysis/**'
      - 'mobile/**'
      - 'deploy/**'
      - '.github/workflows/release-candidate-check.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests with diagnostics
        run: timeout --signal=TERM 12m pytest -vv --durations=25

  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir dist-android

  android-installable-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Sign release with the generated Android debug keystore
        run: |
          test -f android/app/debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          marker = 'release {'
          if marker not in text:
              raise SystemExit('release build type not found')
          head, tail = text.split(marker, 1)
          block = tail.split('}', 1)[0]
          if 'signingConfig signingConfigs.debug' not in block:
              text = head + marker + '\n            signingConfig signingConfigs.debug' + tail
              path.write_text(text, encoding='utf-8')
          PY
      - name: Build standalone signed release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare named APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "BIAP-${VERSION}.apk"
      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: biap-android-signed-${{ github.sha }}
          path: mobile/BIAP-*.apk
          if-no-files-found: error
          retention-days: 14
