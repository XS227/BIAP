name: BIAP Global FIRDS Sweden Denmark integration

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-firds-se-dk-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply Sweden Denmark FIRDS integration
        run: python tools/apply_firds_se_dk_integration.py
      - name: Install backend dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Compile and test Global backend
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/esma_firds_universe.py analysis/global_markets/runtime.py analysis/global_markets/cached_universe.py analysis/tests/test_global_universe_cache_v8.py analysis/tests/test_global_firds_se_dk.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use FIRDS authoritative universes for Sweden and Denmark'
          git push origin HEAD:feat/biap-global
