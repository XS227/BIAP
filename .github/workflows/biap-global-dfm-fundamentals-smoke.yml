name: BIAP Global DFM fundamentals production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-dfm-fundamentals-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify DFM Efsah annual statements on production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()

          for ticker in ('DIC','DEWA'):
              r=s.get(base+'/instruments/AE/DFM',params={'q':ticker,'limit':5},timeout=75)
              print('SEARCH',ticker,r.status_code,r.text[:7000])
              r.raise_for_status()
              rows=r.json().get('instruments') or []
              exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
              if not exact:
                  raise SystemExit(f'{ticker} not found in DFM official universe')
              row=exact[0]
              payload={
                  'country':'AE','exchange':'DFM','ticker':ticker,
                  'name':row.get('name'),'currency':row.get('currency') or 'AED',
                  'isin':row.get('isin'),'lei':row.get('lei'),
              }
              a=s.post(base+'/analyze',json=payload,timeout=150)
              print('ANALYZE',ticker,a.status_code,a.text[:30000])
              a.raise_for_status()
              data=a.json()
              company=data.get('company') or {}
              sources=company.get('sources') or []
              official=[x for x in sources if x.get('provider')=='official-dfm-efsah-annual-statement']
              assert official, sources
              assert company.get('filing_period_end') == '2025-12-31', company
              assert company.get('net_income') is not None, company
              assert company.get('total_equity') is not None, company
              assert company.get('operating_cash_flow') is not None, company
              if ticker == 'DIC':
                  assert company.get('total_assets') is not None, company
              if ticker == 'DEWA':
                  assert company.get('revenue') is not None, company
                  assert company.get('total_equity') == 97769535000.0, company
              evidence=data.get('evidence') or {}
              assert 'fundamental_source' not in (evidence.get('missing_critical') or []), evidence
              print('OK',ticker,'official DFM annual statement connected',
                    company.get('filing_period_end'),company.get('net_income'),
                    company.get('total_assets'),company.get('total_equity'),
                    company.get('operating_cash_flow'),evidence.get('status'))
          PY
