name: BIAP Global strict universe routing

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-strict-universe-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0

      - name: Patch strict MIC routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('analysis/global_markets/universe.py')
          text = p.read_text(encoding='utf-8')

          old = '''    def _get_page(self, *, country: str, spec: ExchangeSpec, page: int, outputsize: int) -> dict:\n        common = {"page": page, "outputsize": outputsize, "format": "JSON", "type": "Common Stock"}\n        candidates: list[dict] = []\n\n        if spec.mic:\n            candidates.append(self._request({**common, "mic_code": spec.mic}))\n\n        country_name = get_country_pack(country).name\n        try:\n            candidates.append(self._request({**common, "country": country_name, "exchange": spec.label}))\n        except GlobalProviderError:\n            if not candidates:\n                raise\n\n        if not candidates:\n            raise GlobalProviderError(f"no reference-data lookup strategy for {country}/{spec.code}")\n        return max(candidates, key=self._payload_score)\n'''
          new = '''    def _get_page(self, *, country: str, spec: ExchangeSpec, page: int, outputsize: int) -> dict:\n        common = {"page": page, "outputsize": outputsize, "format": "JSON", "type": "Common Stock"}\n\n        # A venue MIC is stronger identity evidence than a free-text exchange\n        # label. Never replace a valid MIC-scoped page merely because a broader\n        # country/exchange query happens to return more rows. Some vendor tiers\n        # ignore the exchange label and can otherwise contaminate one market\n        # with thousands of unrelated instruments.\n        if spec.mic:\n            try:\n                mic_payload = self._request({**common, "mic_code": spec.mic})\n                if self._payload_score(mic_payload)[0] > 0:\n                    return mic_payload\n            except GlobalProviderError:\n                pass\n\n        country_name = get_country_pack(country).name\n        try:\n            fallback = self._request({**common, "country": country_name, "exchange": spec.label})\n        except GlobalProviderError as exc:\n            raise GlobalProviderError(f"no reference-data lookup strategy for {country}/{spec.code}") from exc\n        return fallback\n'''
          if old not in text and new not in text:
              raise SystemExit('get_page anchor not found')
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        accepted_mics = set(spec.accepted_mics)\n        if accepted_mics and returned_mic and returned_mic not in accepted_mics:\n            return None\n'''
          new = '''        accepted_mics = set(spec.accepted_mics)\n        # When BIAP claims that an instrument belongs to a specific exchange,\n        # the provider must identify that venue. A missing MIC is not enough\n        # evidence for full-market ranking and is rejected rather than guessed.\n        if accepted_mics and not returned_mic:\n            return None\n        if accepted_mics and returned_mic not in accepted_mics:\n            return None\n'''
          if old not in text and new not in text:
              raise SystemExit('MIC validation anchor not found')
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat >> analysis/tests/test_global_universe.py <<'PY'


def test_configured_exchange_rejects_row_without_mic():
    from global_markets.country_packs import get_exchange
    from global_markets.universe import TwelveDataUniverseProvider

    provider = TwelveDataUniverseProvider(api_key='demo')
    item = provider._company_from_row(
        country='IT',
        spec=get_exchange('IT', 'EURONEXT_MILAN'),
        row={'symbol':'RACE','name':'Ferrari N.V.','type':'Common Stock','currency':'EUR','mic_code':''},
    )
    assert item is None


def test_mic_scoped_page_wins_over_larger_text_fallback():
    from global_markets.country_packs import get_exchange
    from global_markets.universe import TwelveDataUniverseProvider

    provider = TwelveDataUniverseProvider(api_key='demo')
    calls = []
    def fake_request(params, endpoint='stocks'):
        calls.append(dict(params))
        if params.get('mic_code') == 'XMIL':
            return {'data':[{'symbol':'RACE','mic_code':'XMIL'}], 'count':1}
        return {'data':[{'symbol':f'X{i}'} for i in range(1000)], 'count':1000}
    provider._request = fake_request
    payload = provider._get_page(country='IT', spec=get_exchange('IT','EURONEXT_MILAN'), page=1, outputsize=1000)
    assert payload['count'] == 1
    assert len(calls) == 1
    assert calls[0].get('mic_code') == 'XMIL'
PY

      - name: Run Global backend tests
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q global_markets global_routes.py
          pytest -q tests/test_global_*.py

      - name: Commit strict routing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/universe.py analysis/tests/test_global_universe.py
          git diff --cached --quiet && exit 0
          git commit -m 'Require verified exchange MIC in global equity universe'
          git push origin HEAD:feat/biap-global
