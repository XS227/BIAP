name: BIAP Global official production probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-official-production-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public production API
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.parse, urllib.request

          base='https://biap.dadashi.no/global-api/global'
          def get(path, params=None):
              url=base+path
              if params: url += '?' + urllib.parse.urlencode(params)
              last=None
              for attempt in range(1,4):
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'BIAP-official-production-probe'})
                  try:
                      with urllib.request.urlopen(req,timeout=120) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as exc:
                      last=exc
                      if exc.code not in (502,503,504) or attempt == 3:
                          raise
                      print('HTTP_RETRY',attempt,exc.code,url,flush=True)
                      time.sleep(2*attempt)
              raise last

          def catalog(country,exchange):
              return get(f'/instruments/{country}/{exchange}',{'limit':5})
          def search(country,exchange,q):
              return get(f'/instruments/{country}/{exchange}',{'q':q,'limit':20})

          results={}
          for key,country,exchange in [
              ('xetra','DE','XETRA'),('frankfurt','DE','FRANKFURT'),('asx','AU','ASX'),
              ('nse','IN','NSE'),('bse','IN','BSE'),('krx','KR','KRX'),('hkex','HK','HKEX'),('jse','ZA','JSE'),
              ('sgx','SG','SGX'),('dfm','AE','DFM'),('adx','AE','ADX'),('saudi','SA','SAUDI_EXCHANGE')
          ]:
              print('CATALOG_START',key,country,exchange,flush=True)
              started=time.monotonic()
              try:
                  row=catalog(country,exchange)
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode('utf-8','replace')
                  print('CATALOG_ERROR',key,'HTTP',exc.code,'BODY',body[:4000],flush=True)
                  raise
              except Exception as exc:
                  print('CATALOG_ERROR',key,type(exc).__name__,str(exc)[:4000],flush=True)
                  raise
              print('CATALOG_OK',key,'count',row.get('totalMatched'),'catalog',row.get('catalog'),'secs',round(time.monotonic()-started,2),flush=True)
              results[key]={
                  'totalMatched':row.get('totalMatched'),
                  'returned':row.get('returned'),
                  'catalog':row.get('catalog'),
                  'sample':[(x.get('ticker'),x.get('name'),x.get('isin'),x.get('mic_code') or x.get('mic')) for x in row.get('instruments',[])],
              }

          checks={
              'xetra_sap':search('DE','XETRA','SAP'),
              'xetra_strabag':search('DE','XETRA','XD4'),
              'frankfurt_sap':search('DE','FRANKFURT','SAP'),
              'asx_bhp':search('AU','ASX','BHP'),
              'nse_reliance':search('IN','NSE','RELIANCE'),
              'krx_samsung':search('KR','KRX','005930'),
              'hkex_hkex':search('HK','HKEX','0388'),
              'hkex_hsbc':search('HK','HKEX','0005'),
              'jse_mtn':search('ZA','JSE','MTN'),
              'jse_naspers':search('ZA','JSE','NPN'),
              'bse_reliance':search('IN','BSE','RELIANCE'),
              'bse_tcs':search('IN','BSE','TCS'),
              'sgx_sgx':search('SG','SGX','S68'),
              'dfm_emaar':search('AE','DFM','EMAAR'),
              'adx_adcb':search('AE','ADX','ADCB'),
              'saudi_aramco':search('SA','SAUDI_EXCHANGE','2222'),
          }
          print(json.dumps({'markets':results,'checks':{k:{'totalMatched':v.get('totalMatched'),'tickers':[x.get('ticker') for x in v.get('instruments',[])]} for k,v in checks.items()}},indent=2))

          assert 300 <= int(results['xetra']['totalMatched']) <= 700, results['xetra']
          assert 300 <= int(results['frankfurt']['totalMatched']) <= 800, results['frankfurt']
          assert 1500 <= int(results['asx']['totalMatched']) <= 2200, results['asx']
          assert 2000 <= int(results['nse']['totalMatched']) <= 3000, results['nse']
          assert 2300 <= int(results['krx']['totalMatched']) <= 3200, results['krx']
          assert 2600 <= int(results['hkex']['totalMatched']) <= 2800, results['hkex']
          assert 290 <= int(results['jse']['totalMatched']) <= 330, results['jse']
          assert int(results['bse']['totalMatched']) >= 3500, results['bse']
          assert int(results['sgx']['totalMatched']) >= 300, results['sgx']
          assert int(results['dfm']['totalMatched']) >= 20, results['dfm']
          assert int(results['adx']['totalMatched']) >= 40, results['adx']
          assert int(results['saudi']['totalMatched']) >= 200, results['saudi']
          assert results['hkex']['catalog'].get('provider') == 'official-hkex-list-of-securities', results['hkex']
          assert results['jse']['catalog'].get('provider') == 'official-jse-equities-isin-full', results['jse']
          assert results['bse']['catalog'].get('provider') == 'official-bse-equity-bhavcopy', results['bse']
          assert results['sgx']['catalog'].get('provider') == 'official-sgx-website-securities', results['sgx']
          assert results['dfm']['catalog'].get('provider') == 'official-dfm-fresh-securities', results['dfm']
          assert results['adx']['catalog'].get('provider') == 'official-adx-issuer-directory', results['adx']
          assert results['saudi']['catalog'].get('provider') == 'official-saudi-exchange-daily-report', results['saudi']
          assert checks['xetra_sap'].get('totalMatched',0) >= 1
          assert checks['frankfurt_sap'].get('totalMatched',0) >= 1
          assert checks['asx_bhp'].get('totalMatched',0) >= 1
          assert checks['nse_reliance'].get('totalMatched',0) >= 1
          assert checks['krx_samsung'].get('totalMatched',0) >= 1
          assert checks['hkex_hkex'].get('totalMatched',0) >= 1
          assert checks['hkex_hsbc'].get('totalMatched',0) >= 1
          assert checks['jse_mtn'].get('totalMatched',0) >= 1
          assert checks['jse_naspers'].get('totalMatched',0) >= 1
          assert checks['bse_reliance'].get('totalMatched',0) >= 1
          assert checks['bse_tcs'].get('totalMatched',0) >= 1
          assert checks['sgx_sgx'].get('totalMatched',0) >= 1
          assert checks['dfm_emaar'].get('totalMatched',0) >= 1
          assert checks['adx_adcb'].get('totalMatched',0) >= 1
          assert checks['saudi_aramco'].get('totalMatched',0) >= 1
          assert checks['xetra_strabag'].get('totalMatched',0) == 0, checks['xetra_strabag']
          PY
