name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'deploy/systemd/**'
      - 'deploy/publish-mobile-apk.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_run:
    workflows: ["Release candidate check"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-backend:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests with diagnostics
        run: timeout --signal=TERM 12m pytest -vv --durations=25

  deploy:
    needs: validate-backend
    if: needs.validate-backend.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_BACKEND_RESTART_CMD: ${{ vars.VPS_BACKEND_RESTART_CMD }}
      VPS_HEALTH_URL: ${{ vars.VPS_HEALTH_URL }}

    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST}" || -z "${VPS_USER}" || -z "${VPS_SSH_KEY}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend deploy skipped: configure production secrets VPS_HOST, VPS_USER and VPS_SSH_KEY."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download successful main-branch APK
        if: steps.config.outputs.configured == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: biap-android-qa-*
          path: /tmp/biap-apk
          merge-multiple: true

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/biap_deploy_key
          chmod 600 ~/.ssh/biap_deploy_key
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main to VPS
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          APP_DIR="${VPS_APP_DIR:-/root/BIAP}"
          RESTART_CMD="${VPS_BACKEND_RESTART_CMD:-systemctl restart biap-fin}"
          HEALTH_URL="${VPS_HEALTH_URL:-https://biap.dadashi.no/api/health}"

          ssh -i ~/.ssh/biap_deploy_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' RESTART_CMD='$RESTART_CMD' HEALTH_URL='$HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          test -d .git || { echo "Not a git checkout: $APP_DIR" >&2; exit 1; }
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Refusing deploy: VPS working tree has local changes." >&2
            git status --short
            exit 1
          fi

          OLD_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          NEW_SHA="$(git rev-parse HEAD)"

          if ! git diff --quiet "$OLD_SHA" "$NEW_SHA" -- analysis/requirements.txt; then
            echo "Python requirements changed; updating dependencies."
            if [[ -x analysis/.venv/bin/python ]]; then
              analysis/.venv/bin/python -m pip install -r analysis/requirements.txt
            elif [[ -x .venv/bin/python ]]; then
              .venv/bin/python -m pip install -r analysis/requirements.txt
            elif [[ -x venv/bin/python ]]; then
              venv/bin/python -m pip install -r analysis/requirements.txt
            else
              python3 -m pip install --user -r analysis/requirements.txt
            fi
          else
            echo "Python requirements unchanged; skipping dependency install."
          fi

          as_root() {
            if [[ "$(id -u)" -eq 0 ]]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          for unit in biap-listed-company-baseline.service biap-listed-company-baseline.timer; do
            test -f "deploy/systemd/$unit" || { echo "Missing systemd unit: $unit" >&2; exit 1; }
            as_root install -m 0644 "deploy/systemd/$unit" "/etc/systemd/system/$unit"
          done
          as_root systemctl daemon-reload
          as_root systemctl enable --now biap-listed-company-baseline.timer
          as_root systemctl start --no-block biap-listed-company-baseline.service
          as_root systemctl is-enabled biap-listed-company-baseline.timer
          as_root systemctl is-active biap-listed-company-baseline.timer
          as_root systemctl status biap-listed-company-baseline.service --no-pager || true

          bash -lc "$RESTART_CMD"

          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" >/tmp/biap-health.json; then
              if python3 - <<'PY'
          import json
          with open('/tmp/biap-health.json', 'r', encoding='utf-8') as fh:
              payload = json.load(fh)
          raise SystemExit(0 if payload.get('ready') is True else 1)
          PY
              then
                cat /tmp/biap-health.json
                echo
                echo "Backend deploy healthy at $(git rev-parse --short HEAD)"
                exit 0
              fi
            fi
            sleep 5
          done

          echo "Health check failed or API never reported ready=true." >&2
          cat /tmp/biap-health.json 2>/dev/null || true
          systemctl status biap-fin --no-pager || true
          exit 1
          REMOTE

      - name: Publish latest APK to VPS
        if: steps.config.outputs.configured == 'true' && github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          APP_DIR="${VPS_APP_DIR:-/root/BIAP}"
          APK="$(find /tmp/biap-apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK"
          scp -i ~/.ssh/biap_deploy_key -P "$PORT" -o BatchMode=yes "$APK" "$VPS_USER@$VPS_HOST:/tmp/biap-latest.apk"
          ssh -i ~/.ssh/biap_deploy_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          bash deploy/publish-mobile-apk.sh /tmp/biap-latest.apk "$APP_DIR"
          rm -f /tmp/biap-latest.apk
          REMOTE

      - name: Deployment summary
        shell: bash
        run: |
          if [[ "${{ steps.config.outputs.configured }}" == "true" ]]; then
            echo "### Backend deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "Production deploy attempted after backend validation." >> "$GITHUB_STEP_SUMMARY"
            echo "Listed-company 300/day baseline timer was installed, enabled, and a manual run was started." >> "$GITHUB_STEP_SUMMARY"
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "Latest successful Android APK and matching version marker were published to the VPS update center." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### Backend deploy not configured yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Add production secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY." >> "$GITHUB_STEP_SUMMARY"
            echo "Optional secret: VPS_PORT. Optional variables: VPS_APP_DIR, VPS_BACKEND_RESTART_CMD, VPS_HEALTH_URL." >> "$GITHUB_STEP_SUMMARY"
          fi
