name: BIAP Global JPX official universe probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-jpx-universe-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - name: Inspect JPX listed issues workbook
        run: |
          python -m pip install -q requests beautifulsoup4 openpyxl xlrd
          python - <<'PY'
          import io, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          import openpyxl, xlrd

          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept-Language":"en-US,en;q=0.9"})
          urls=[
              "https://www.jpx.co.jp/markets/statistics-equities/misc/01.html",
              "https://www.jpx.co.jp/english/markets/statistics-equities/misc/01.html",
          ]
          candidates=[]
          for page in urls:
              r=s.get(page,timeout=30)
              print("\nPAGE",page,r.status_code,r.url,r.headers.get("content-type"),len(r.content))
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  href=urljoin(r.url,a["href"])
                  txt=" ".join(a.stripped_strings)
                  low=(txt+" "+href).lower()
                  if any(x in low for x in [".xls",".xlsx",".csv"]) or "上場銘柄" in txt or "listed" in txt.lower():
                      print("LINK",json.dumps((txt,href),ensure_ascii=False))
                      if any(href.lower().endswith(x) or x in href.lower() for x in [".xls",".xlsx",".csv"]):
                          candidates.append(href)
          print("CANDIDATES",json.dumps(candidates,ensure_ascii=False,indent=2))
          seen=set()
          for url in candidates:
              if url in seen: continue
              seen.add(url)
              r=s.get(url,timeout=40,allow_redirects=True)
              print("\nRESOURCE",url,r.status_code,r.url,r.headers.get("content-type"),r.headers.get("content-disposition"),len(r.content),repr(r.content[:12]))
              if not r.ok: continue
              data=r.content
              try:
                  if data[:2]==b"PK":
                      wb=openpyxl.load_workbook(io.BytesIO(data),read_only=True,data_only=True)
                      print("XLSX",wb.sheetnames)
                      for ws in wb.worksheets:
                          print("SHEET",ws.title,ws.max_row,ws.max_column)
                          for i,row in enumerate(ws.iter_rows(values_only=True),1):
                              print("ROW",i,json.dumps([None if v is None else str(v)[:220] for v in row],ensure_ascii=False))
                              if i>=20: break
                  elif data[:8]==b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1":
                      book=xlrd.open_workbook(file_contents=data)
                      print("XLS",book.sheet_names())
                      for ws in book.sheets():
                          print("SHEET",ws.name,ws.nrows,ws.ncols)
                          for i in range(min(ws.nrows,20)):
                              print("ROW",i+1,json.dumps([str(ws.cell_value(i,j))[:220] for j in range(ws.ncols)],ensure_ascii=False))
              except Exception as e:
                  print("PARSE_ERR",type(e).__name__,str(e))
          PY
