name: BIAP Global NZX issuer production smoke

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-nzx-issuer-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Verify NZX Limited official annual fundamentals in production
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://biap.dadashi.no/global-api/global'
          s=requests.Session()
          ticker='NZX'
          r=s.get(base+'/instruments/NZ/NZX',params={'q':ticker,'limit':5},timeout=75)
          print('SEARCH',r.status_code,r.text[:8000])
          r.raise_for_status()
          rows=r.json().get('instruments') or []
          exact=[x for x in rows if str(x.get('ticker') or '').upper()==ticker]
          assert exact, rows
          row=exact[0]
          payload={'country':'NZ','exchange':'NZX','ticker':ticker,'name':row.get('name'),
                   'currency':row.get('currency') or 'NZD','isin':row.get('isin'),'lei':row.get('lei')}
          a=s.post(base+'/analyze',json=payload,timeout=180)
          print('ANALYZE',a.status_code,a.text[:30000])
          a.raise_for_status()
          data=a.json(); company=data.get('company') or {}; sources=company.get('sources') or []
          assert any(x.get('provider')=='official-nzx-issuer-annual-report-v2' for x in sources), sources
          assert any(x.get('source_type')=='official_exchange_financial_statement' for x in sources), sources
          assert company.get('revenue') is not None and company.get('revenue') > 0, company
          assert company.get('net_income') is not None, company
          assert company.get('total_assets') is not None, company
          assert company.get('total_liabilities') is not None, company
          assert company.get('total_equity') is not None, company
          assert company.get('operating_cash_flow') is not None, company
          assert company.get('filing_period_end') == '2025-12-31', company
          evidence=data.get('evidence') or {}
          missing=evidence.get('missing_critical') or []
          assert 'fundamental_source' not in missing, evidence
          print('OK NZX annual filing connected',
                company.get('revenue'),company.get('net_income'),company.get('total_assets'),
                company.get('total_liabilities'),company.get('total_equity'),
                company.get('operating_cash_flow'),evidence.get('status'),missing)
          PY
