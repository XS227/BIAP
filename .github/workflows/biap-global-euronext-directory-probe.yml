name: BIAP Global Euronext directory probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-euronext-directory-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests beautifulsoup4
      - name: Inspect official directory transport
        run: python tools/probe_euronext_live_directory.py
