name: BIAP Global JPX official trust fix

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-jpx-official-trust-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
          fetch-depth: 0
      - name: Apply isolated JPX trust fix
        run: python tools/apply_jpx_official_trust_fix.py
      - name: Install backend dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Compile and test Global backend
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q global_markets global_routes.py global_api_server.py
          pytest -q tests/test_global_*.py
      - name: Commit tested JPX trust fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/global_markets/jpx_official.py analysis/global_markets/cached_universe.py analysis/global_markets/universe.py analysis/tests/test_global_universe_cache_v8.py
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve JPX-certified common equities through cache filters'
          git push origin HEAD:feat/biap-global
