name: BIAP Global Xetra FIRDS LEI coverage

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-xetra-firds-lei-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - name: Install backend dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Audit FIRDS issuer LEI coverage
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: python ../tools/probe_xetra_firds_lei_coverage.py
