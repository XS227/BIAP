name: BIAP Global US official universe join probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-us-official-join-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - run: python -m pip install -q requests
      - run: python tools/probe_us_official_universe_join.py
