name: BIAP Global FIRDS vendor join v2

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-firds-vendor-join-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biap-global
      - name: Install dependencies
        working-directory: analysis
        run: python -m pip install -q -r requirements.txt
      - name: Probe exact FIRDS ISIN to vendor ticker join
        working-directory: analysis
        env:
          PYTHONPATH: .
        run: python ../tools/probe_firds_vendor_join_v2.py
