name: BIAP Global JSE official equity format probe

on:
  push:
    branches: [feat/biap-global]
    paths:
      - '.github/workflows/biap-global-jse-official-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Inspect JSE official equity ISIN full file
        run: |
          python - <<'PY'
          import io, zipfile, requests
          url='https://clientportal.jse.co.za/Reports/Downloadable-Files/Download?filepath=ISIN%2FEquities%2Fisinfull_e.zip'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 BIAP-Global','Accept':'application/zip,*/*','Referer':'https://clientportal.jse.co.za/downloadable-files?RequestNode=/ISIN/Equities'},timeout=60)
          print('status',r.status_code,'bytes',len(r.content),'type',r.headers.get('content-type'))
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          print('files',z.namelist())
          for name in z.namelist():
              if name.endswith('/'): continue
              body=z.read(name)
              print('FILE',name,'bytes',len(body),'head',repr(body[:500]))
              text=None
              for enc in ('utf-8-sig','cp1252','latin-1'):
                  try:
                      text=body.decode(enc); break
                  except UnicodeDecodeError: pass
              if text:
                  lines=[x for x in text.splitlines() if x.strip()]
                  print('lines',len(lines))
                  for line in lines[:15]: print(line[:1200])
                  from collections import Counter
                  types=Counter(line[209:219].strip() for line in lines if len(line)>=230)
                  currencies=Counter(line[206:209].strip() for line in lines if len(line)>=230)
                  print('SECURITY_TYPES',types.most_common())
                  print('CURRENCIES',currencies.most_common())
                  for needle in ('NASPERS','MTN GROUP','SHOPRITE','STANDARD BANK','ANGLO AMERICAN'):
                      match=next((line for line in lines if needle in line.upper()),None)
                      if match:
                          print('MATCH',needle,'LEN',len(match),'LINE',match)
                          for token in ('NPN','MTN','SHP','SBK','AGL','ZAC','ZAR'):
                              pos=match.find(token)
                              if pos>=0: print('POS',needle,token,pos,repr(match[max(0,pos-15):pos+35]))
          PY
